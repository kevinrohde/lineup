<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Weekly Lineup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root{
    --field:#2F6B45;
    --field-dark:#1F4A30;
    --dirt:#C9A66B;
    --ball:#D6472C;
    --ball-dark:#A83521;
    --cream:#FBF6EC;
    --ink:#1C2B24;
    --ink-soft:#5B6E63;
    --line:#DCD3BE;
    --white:#FFFFFF;
    /* text colors that sit ON the theme colors \u2014 recomputed for contrast when a team picks its own colors */
    --on-field:#FBF6EC;
    --on-field-dark:#FBF6EC;
    --on-ball:#FBF6EC;
    --on-ball-dark:#FBF6EC;
    --ball-text:#D6472C;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;}
  #app{
    font-family:'JetBrains Mono', monospace;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    padding:0 0 48px 0;
  }
  .scoreboard{
    background:var(--field);
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 40px);
    color:var(--on-field);
    padding:22px 24px 18px;
    border-bottom:6px solid var(--dirt);
    position:relative;
  }
  .scoreboard h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin:0 0 2px 0;
    line-height:1.1;
    overflow-wrap:anywhere;
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .brand-logo{
    height:68px;width:auto;max-width:150px;object-fit:contain;flex:none;
    background:var(--cream);border-radius:12px;padding:5px;
    box-shadow:0 1px 4px rgba(0,0,0,0.3);
  }
  .scoreboard .sub{
    font-size:12px;
    opacity:var(--sub-opacity, 0.85);
    letter-spacing:0.5px;
  }
  .ball-icon{width:34px;height:34px;flex:none;}
  .tabs{
    display:flex;
    gap:2px;
    background:var(--field-dark);
    padding:0 24px;
  }
  .tab{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--on-field-dark);
    opacity:0.6;
    background:transparent;
    border:none;
    padding:12px 18px;
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .tab.active{
    opacity:1;
    border-bottom:3px solid var(--ball);
  }
  .content{
    max-width:980px;
    margin:0 auto;
    padding:28px 24px 0;
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px 22px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:'Oswald', sans-serif;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin:0 0 14px 0;
    color:var(--field-dark);
    border-bottom:2px solid var(--dirt);
    padding-bottom:8px;
  }
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  input[type=text], input[type=number]{
    font-family:'JetBrains Mono', monospace;
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 10px;
    font-size:13px;
    background:var(--cream);
    color:var(--ink);
  }
  select{
    font-family:'JetBrains Mono', monospace;
    border:1px solid var(--line);
    border-radius:4px;
    padding:6px 8px;
    font-size:12px;
    background:var(--white);
    color:var(--ink);
    width:100%;
  }
  button{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:0.3px;
    text-transform:uppercase;
    font-size:12px;
    border:none;
    border-radius:4px;
    padding:9px 16px;
    cursor:pointer;
    background:var(--field);
    color:var(--on-field);
  }
  button:hover{background:var(--field-dark);color:var(--on-field-dark);}
  button.primary{background:var(--ball);color:var(--on-ball);}
  button.primary:hover{background:var(--ball-dark);color:var(--on-ball-dark);}
  button.ghost{background:transparent;color:var(--field-dark);border:1px solid var(--field);}
  button.ghost:hover{background:var(--field);color:var(--on-field);}
  button.small{padding:4px 8px;font-size:11px;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  th{background:var(--dirt);color:var(--field-dark);font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;letter-spacing:0.3px;}
  td.name-cell{text-align:left;font-weight:600;}
  .roster-list{display:flex;flex-direction:column;gap:6px;}
  .roster-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--cream);
  }
  .roster-item.inactive{opacity:0.45;}
  .roster-item .pname{flex:1;font-weight:600;}
  .badge{
    display:inline-block;font-size:10px;font-family:'Oswald',sans-serif;text-transform:uppercase;
    padding:2px 7px;border-radius:10px;background:var(--field);color:var(--on-field);letter-spacing:0.3px;
  }
  .badge.bench{background:var(--ink-soft);}
  .note{font-size:12px;color:var(--ink-soft);margin:0 0 14px 0;line-height:1.5;}
  .warn{
    background:#FDECEA;background:color-mix(in srgb, var(--ball) 12%, #fff);border:1px solid var(--ball);color:var(--ball-dark);
    padding:8px 12px;border-radius:4px;font-size:12px;margin-bottom:12px;
  }
  .confirm{
    background:#EAF4EC;background:color-mix(in srgb, var(--field) 12%, #fff);border:1px solid var(--field);color:var(--field-dark);
    padding:10px 14px;border-radius:4px;font-size:12px;margin-bottom:14px;
  }
  .bench-line{font-size:11px;color:var(--ink-soft);margin-top:8px;}
  .batting-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .batting-list li{
    display:flex;align-items:center;gap:8px;
    background:var(--cream);border:1px solid var(--line);border-radius:4px;padding:6px 10px;
  }
  .batting-list .num{
    font-family:'Oswald',sans-serif;font-weight:700;color:var(--ball-text);width:20px;
  }
  .batting-list .bname{flex:1;font-weight:600;}
  .bar-track{background:var(--line);border-radius:3px;height:8px;width:100%;overflow:hidden;}
  .bar-fill{background:var(--field);height:100%;}
  .fair-below .bar-fill{background:var(--ball);}
  .loading{padding:60px;text-align:center;color:var(--ink-soft);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;}
  .empty{padding:30px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .settings-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px;}
  .settings-row label{font-size:11px;text-transform:uppercase;font-family:'Oswald',sans-serif;color:var(--ink-soft);display:block;margin-bottom:4px;}

  /* ---------- Phones and small tablets ---------- */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}   /* stop the browser from inflating some text and not other text */
  @media (max-width: 720px){
    #app{padding-bottom:max(48px, env(safe-area-inset-bottom));}
    .scoreboard{padding:max(14px, env(safe-area-inset-top)) 14px 12px;}
    .scoreboard h1{font-size:22px;}
    .brand{gap:10px;}
    .brand-logo{height:52px;max-width:110px;padding:4px;border-radius:10px;}
    .ball-icon{width:28px;height:28px;}
    .season-pick{width:100%;margin-top:4px;}
    .season-pick select{min-height:40px;}
    /* tab bar scrolls sideways instead of squashing nine labels into a few pixels each */
    .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 6px;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{white-space:nowrap;flex:none;padding:13px 14px;}
    .content{padding:14px 10px 0;}
    .card{padding:14px 12px;overflow-x:auto;}
    .card h2{font-size:15px;}
    /* tables scroll inside their card, with the first column pinned so you always know whose row it is */
    table{min-width:540px;}
    td.name-cell,th:first-child{position:sticky;left:0;z-index:1;}
    td.name-cell{background:var(--white);box-shadow:1px 0 0 var(--line);}
    th:first-child{z-index:2;}
    /* 16px inputs stop iOS from zooming the page every time you tap a field; bigger tap targets */
    input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px !important;min-height:42px;}   /* !important: a few fields set their own size inline */
    td select{min-width:116px;}   /* fielding-chart dropdowns must show "Pitcher", not "Pit" \u2014 the table scrolls instead */
    input[type=checkbox]{width:24px;height:24px;}
    td,th{padding:9px 8px;}
    label:has(> input[type=checkbox]){min-height:42px;}
    button{min-height:42px;padding:10px 14px;}
    button.small{min-height:36px;padding:6px 12px;}
    label.ghost{min-height:42px;}
    .settings-row{gap:12px;}
    .roster-item{flex-wrap:wrap;}
    .roster-item input[type=text]{flex:1 1 100%;}
    .batting-list li button{min-width:38px;}
  }
</style>
<div id="app"><div class="loading">Loading roster&hellip;</div></div>
<script>
(function(){
  const DEFAULT_POSITIONS = ["Pitcher","Catcher","1B","2B","3B","SS","LF","LCF","RCF","RF"];
  const TEAM_DEFAULTS = {primary:'#2F6B45', accent:'#D6472C'};
  const GENERAL_SKILLS = ["Running","Throwing","Catching","Decision Making","Big Kicks","Bunts"];
  let roster = [];        // {id, name, active, neverBench}
  let positions = DEFAULT_POSITIONS.slice();
  let innings = 6;
  let battingPointer = 0;
  let preferredPositions = {}; // playerId -> {1: pos, 2: pos, 3: pos} ranked, coach-only
  let excludedPositions = {};  // playerId -> array of individual position names this player never plays
  let generalSkills = {};   // playerId -> {skillName: rating 1-5}, coach-only
  let weekLog = [];        // [{label, date, gameDate, innings, positions, grid, battingOrder, activeIds, played}]
  let scheduleDates = [];  // ['YYYY-MM-DD', ...] the season's game dates
  let attendance = {};     // dateStr -> {playerId: true} where true = known absent
  let gameDetails = {};    // dateStr -> {time, field, mapImage: dataURL or null}
  let playerCards = {};    // playerId -> {photo: dataURL or null, tagline: ''}
  let neverBenchByDate = {}; // dateStr -> {playerId: true} -- per-game, does NOT persist to other dates
  let coreGroup = {};      // playerId -> true; the players the coach counts as the "core" for Game Stats
  let baseline = {};       // playerId -> {games, inningsFielded, inningsBenched, positions, benchRecency} carried in from earlier seasons
  let seasonsMeta = null;  // {currentId, list:[{id,name,createdAt}], nextId}
  let newSeasonDraft = {open:false, name:'', firstDate:'', numGames:'', newPlayers:'', returning:{}, carryRatings:true, carryStats:true, carryCore:true};
  let seasonMsg = '';
  let team = {name:'', logo:null, primary:TEAM_DEFAULTS.primary, accent:TEAM_DEFAULTS.accent};   // global: not part of any season
  let teamMsg = '';
  let selectedGameDate = null;
  let currentGrid = null;  // [{positions:{pos:id}}] length = innings  (bench derived)
  let currentPosList = []; // every position in play for the current lineup (a position can be vacant in an inning, so this can't be derived from the grid)
  let currentBattingOrder = [];
  let activeTab = 'week';
  let skillsRevealed = false;
  let nextId = 1;
  let lastWarning = '';
  let lastSaveMsg = '';

  function uid(){ return 'p' + (nextId++); }

  function defaultSeasonDates(){
    const dates = [];
    let d = new Date('2026-08-29T00:00:00');
    const end = new Date('2026-10-24T00:00:00');
    while(d <= end){
      dates.push(d.toISOString().slice(0,10));
      d.setDate(d.getDate()+7);
    }
    return dates;
  }
  function fmtDate(d){
    if(!d) return '';
    const [y,m,day] = d.split('-');
    return `${parseInt(m,10)}/${parseInt(day,10)}`;
  }
  function isGamePlayed(date){
    // "Played" belongs to the game (a row in the Schedule), not to a saved lineup \u2014 a game
    // can be played whether or not anyone saved a lineup for it.
    return !!(date && gameDetails[date] && gameDetails[date].played);
  }
  function nextUnplayedDate(){
    return scheduleDates.find(d=>!isGamePlayed(d)) || scheduleDates[scheduleDates.length-1] || null;
  }
  function migratePlayedFlags(){
    // Older versions stored "played" on each saved lineup. Move it onto the game's schedule row.
    let changed = false;
    weekLog.forEach(w=>{
      if(w.played !== undefined){
        if(w.played && w.gameDate){ ensureGameDetails(w.gameDate).played = true; }
        delete w.played;
        changed = true;
      }
    });
    return changed;
  }
  function activePlayersForDate(date){
    const absentSet = (date && attendance[date]) || {};
    return roster.filter(p=>p.active && !absentSet[p.id]);
  }
  function ensureGameDetails(date){
    if(!date) return {time:'', field:'', mapImage:null, opponent:'', ourScore:null, theirScore:null, played:false};
    if(!gameDetails[date]) gameDetails[date] = {time:'', field:'', mapImage:null, opponent:'', ourScore:null, theirScore:null, played:false};
    return gameDetails[date];
  }
  function peekGameDetails(date){
    // Read-only: rendering a tab must never create or change saved data.
    return (date && gameDetails[date]) || {time:'', field:'', mapImage:null, opponent:'', ourScore:null, theirScore:null, played:false};
  }
  function peekPlayerCard(id){
    return playerCards[id] || {photo:null, tagline:''};
  }
  function ensurePlayerCard(id){
    if(!playerCards[id]) playerCards[id] = {photo:null, tagline:''};
    return playerCards[id];
  }
  function gameResult(details){
    if(details.ourScore === null || details.ourScore === undefined || details.ourScore === '' ||
       details.theirScore === null || details.theirScore === undefined || details.theirScore === '') return null;
    const us = Number(details.ourScore), them = Number(details.theirScore);
    if(isNaN(us) || isNaN(them)) return null;
    if(us > them) return 'W';
    if(us < them) return 'L';
    return 'T';
  }
  function downscaleImageFile(file, maxWidth){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          const scale = Math.min(1, maxWidth / img.width);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = ()=> reject(new Error('Could not read that image file.'));
        img.src = e.target.result;
      };
      reader.onerror = ()=> reject(new Error('Could not read that file.'));
      reader.readAsDataURL(file);
    });
  }
  function derivePosList(grid, savedList){
    // Lineups saved before positions were tracked separately have no saved list, so fall
    // back to every position that shows up in any inning, in the normal field order.
    if(savedList && savedList.length) return savedList.slice();
    const seen = new Set();
    grid.forEach(inn=> Object.keys(inn.positions).forEach(p=> seen.add(p)));
    const ordered = positions.filter(p=> seen.has(p));
    seen.forEach(p=>{ if(!ordered.includes(p)) ordered.push(p); });
    return ordered;
  }
  function loadDateIntoEditor(date){
    selectedGameDate = date;
    const entry = weekLog.find(w=>w.gameDate===date);
    if(entry){
      currentGrid = JSON.parse(JSON.stringify(entry.grid));
      currentPosList = derivePosList(currentGrid, entry.posList);
      currentBattingOrder = entry.battingOrder.slice();
    } else {
      currentGrid = null;
      currentPosList = [];
      currentBattingOrder = [];
    }
    lastSaveMsg = '';
    lastWarning = '';
  }
  function isNeverBenchThisDate(date, playerId){
    return !!(date && neverBenchByDate[date] && neverBenchByDate[date][playerId]);
  }

  function computeBenchRecency(){
    // For each player, counts how many PAST PLAYED games they've attended SINCE their
    // last bench turn (0 if benched last game, resets the game right after they sit).
    // A missed game doesn't add to this count for anyone \u2014 it freezes, it neither
    // advances nor resets, so an absence has zero lingering effect once the player
    // returns. This is only a tiebreaker now (see generateLineup) \u2014 the in-game turn
    // count and Never Bench priority decide things first; this just keeps rotation fair
    // across games among players who are otherwise equally positioned this game.
    const played = weekLog.filter(w=>isGamePlayed(w.gameDate)).slice().sort((a,b)=>(a.gameDate||'').localeCompare(b.gameDate||''));
    const lastBenchedIdx = {};
    played.forEach((w, idx)=>{
      const activeIds = w.activeIds || [];
      const assignedPerInning = w.grid.map(inning => new Set(Object.values(inning.positions)));
      activeIds.forEach(id=>{
        const sat = assignedPerInning.some(set=>!set.has(id));
        if(sat) lastBenchedIdx[id] = idx;
      });
    });
    const allIds = new Set(Object.keys(baseline));
    played.forEach(w=> (w.activeIds||[]).forEach(id=>allIds.add(id)));
    const sinceCount = {};
    allIds.forEach(id=>{
      const lastIdx = lastBenchedIdx[id] !== undefined ? lastBenchedIdx[id] : -1;
      // Not benched yet this season? Then the rotation continues from where last season left off.
      let c = (lastIdx === -1 && baseline[id]) ? (baseline[id].benchRecency || 0) : 0;
      for(let i=lastIdx+1;i<played.length;i++){
        if((played[i].activeIds||[]).includes(id)) c++;
      }
      sinceCount[id] = c;
    });
    return sinceCount;
  }

  function computeStats(){
    // Derived fresh from weekLog every time \u2014 only weeks marked "played" count toward
    // season stats, so saving a lineup ahead of time never affects fairness math.
    const s = {};
    function ensure(id){ if(!s[id]) s[id] = {games:0, inningsFielded:0, inningsBenched:0, positions:{}}; return s[id]; }
    weekLog.forEach(w=>{
      if(!isGamePlayed(w.gameDate)) return;
      const activeIds = w.activeIds || [];
      const assignedPerInning = w.grid.map(inning => new Set(Object.values(inning.positions)));
      activeIds.forEach(id=> ensure(id).games += 1);
      w.grid.forEach((inning, idx)=>{
        Object.entries(inning.positions).forEach(([pos, id])=>{
          const st = ensure(id);
          st.inningsFielded += 1;
          st.positions[pos] = (st.positions[pos]||0) + 1;
        });
        activeIds.forEach(id=>{
          if(!assignedPerInning[idx].has(id)) ensure(id).inningsBenched += 1;
        });
      });
    });
    return s;
  }

  const LS_CONFIG = 'kickballLineup_config';
  const LS_PROGRESS = 'kickballLineup_progress';
  const LS_SEASONS = 'kickballLineup_seasons';
  const seasonKey = id => 'kickballLineup_season_' + id;

  function normalizeRoster(arr){
    return (arr || []).slice();
  }
  function deepCopy(x){ return JSON.parse(JSON.stringify(x)); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }

  // ---------- Seasons: what belongs to a season ----------
  // A season is a self-contained snapshot: roster, ratings, schedule, scores, attendance, saved
  // lineups, and any stats carried in from the season before. The CURRENT season lives in the
  // normal config/progress keys; every other season is archived under its own key. Player
  // photos/taglines are deliberately NOT part of a season \u2014 they belong to the player, and
  // copying them into every archived season would burn through the browser's storage quota.
  function defaultSeasonsMeta(){
    return { currentId: 's1', list: [{id:'s1', name:'Fall 2026', createdAt: todayStr()}], nextId: nextId };
  }
  function currentSeason(){
    return seasonsMeta.list.find(s=>s.id===seasonsMeta.currentId) || seasonsMeta.list[0];
  }
  function isNewestSeason(){
    return seasonsMeta.list[seasonsMeta.list.length-1].id === seasonsMeta.currentId;
  }
  function getSnapshot(){
    return {
      config: {roster, positions, innings, battingPointer, preferredPositions, excludedPositions, generalSkills, scheduleDates, attendance, gameDetails, neverBenchByDate, coreGroup, baseline},
      progress: {weekLog}
    };
  }
  function configObject(){
    const c = getSnapshot().config;
    c.playerCards = playerCards;
    c.team = team;
    c.nextId = nextId;
    return c;
  }
  function applySnapshot(snap, opts){
    const c = snap.config || {};
    roster = normalizeRoster(c.roster);
    positions = c.positions || DEFAULT_POSITIONS.slice();
    innings = c.innings || 6;
    battingPointer = c.battingPointer || 0;
    preferredPositions = c.preferredPositions || {};
    excludedPositions = c.excludedPositions || {};
    generalSkills = c.generalSkills || {};
    scheduleDates = c.scheduleDates || [];
    attendance = c.attendance || {};
    gameDetails = c.gameDetails || {};
    neverBenchByDate = c.neverBenchByDate || {};
    coreGroup = c.coreGroup || {};
    baseline = c.baseline || {};
    weekLog = (snap.progress && snap.progress.weekLog) || [];
    if(opts && opts.includeCards){
      playerCards = c.playerCards || {};
      if(c.team) team = Object.assign({name:'', logo:null, primary:TEAM_DEFAULTS.primary, accent:TEAM_DEFAULTS.accent}, c.team);
    }
    // player ids must never be reused across seasons, so this counter only ever goes up
    nextId = Math.max(nextId, c.nextId || 1, roster.length + 1);
    roster.forEach(p=>{ const m = /^p(\d+)$/.exec(p.id); if(m) nextId = Math.max(nextId, Number(m[1]) + 1); });
    return migratePlayedFlags();
  }
  function loadSeasonSnapshot(id){
    try{
      const raw = localStorage.getItem(seasonKey(id));
      return raw ? JSON.parse(raw) : null;
    }catch(e){ console.error('Could not read season', id, e); return null; }
  }
  function saveSeasonsMeta(){
    try{
      seasonsMeta.nextId = nextId;
      localStorage.setItem(LS_SEASONS, JSON.stringify(seasonsMeta));
      return true;
    }catch(e){ console.error('Storage error (seasons):', e); return false; }
  }

  function loadState(){
    let cfgFound = false, migrated = false;
    try{
      const raw = localStorage.getItem(LS_CONFIG);
      if(raw){
        const c = JSON.parse(raw);
        let prog = {weekLog: []};
        try{
          const rp = localStorage.getItem(LS_PROGRESS);
          if(rp) prog = JSON.parse(rp);
        }catch(e){ console.error('Could not read saved progress:', e); }
        migrated = applySnapshot({config: c, progress: prog}, {includeCards: true});
        cfgFound = true;
      }
    }catch(e){ console.error('Could not read saved data:', e); }

    try{
      const rawMeta = localStorage.getItem(LS_SEASONS);
      if(rawMeta) seasonsMeta = JSON.parse(rawMeta);
    }catch(e){ console.error('Could not read seasons:', e); }
    if(!seasonsMeta || !seasonsMeta.list || !seasonsMeta.list.length) seasonsMeta = defaultSeasonsMeta();
    if(!seasonsMeta.list.some(s=>s.id===seasonsMeta.currentId)) seasonsMeta.currentId = seasonsMeta.list[0].id;
    nextId = Math.max(nextId, seasonsMeta.nextId || 1);

    if(!cfgFound){
      const seedNames = ["Aaron","Andrew","Billy","Chris","Garrett","Jeffrey","Kevin","Kyle","Michael","Scott","Sean","Stephen","Timothy"];
      roster = seedNames.map(n=>({id: uid(), name:n, active:true}));
      scheduleDates = defaultSeasonDates();
      attendance = {};
    }
    if(!cfgFound || migrated){ saveConfig(); saveProgress(); }
    else saveSeasonsMeta();
    loadDateIntoEditor(nextUnplayedDate());
    render();
  }

  function saveConfig(){
    try{
      localStorage.setItem(LS_CONFIG, JSON.stringify(configObject()));
    }catch(e){
      console.error('Storage error (config):', e);
      lastSaveMsg = 'Could not save \u2014 your browser storage may be full or blocked.';
      render();
      return false;
    }
    if(seasonsMeta) saveSeasonsMeta();
    return true;
  }
  function saveProgress(){
    try{
      localStorage.setItem(LS_PROGRESS, JSON.stringify({weekLog}));
    }catch(e){
      console.error('Storage error (progress):', e);
      lastSaveMsg = 'Could not save \u2014 your browser storage may be full or blocked.';
      render();
      return false;
    }
    return true;
  }

  // ---------- Backup / restore (now covers every season) ----------
  function buildBackupObject(){
    const archived = {};
    seasonsMeta.list.forEach(s=>{
      if(s.id === seasonsMeta.currentId) return;
      const snap = loadSeasonSnapshot(s.id);
      if(snap) archived[s.id] = snap;
    });
    return {
      tool: 'kickball-lineup-tool',
      version: 2,
      exportedAt: new Date().toISOString(),
      config: configObject(),
      progress: {weekLog},
      seasons: { meta: {currentId: seasonsMeta.currentId, list: seasonsMeta.list, nextId}, archived }
    };
  }
  function exportBackup(){
    const blob = new Blob([JSON.stringify(buildBackupObject(), null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `kickball-backup-${todayStr()}.json`;
    a.click();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
  }
  function backupIsFull(data){
    return !!(data && data.seasons && data.seasons.meta && data.seasons.meta.list && data.seasons.meta.list.length);
  }
  function restoreBackup(data){
    if(!data || !data.config || !data.progress) throw new Error('This file doesn\'t look like a lineup tool backup.');
    if(backupIsFull(data)){
      // Version 2: replace everything, every season included.
      seasonsMeta.list.forEach(s=>{ if(s.id !== seasonsMeta.currentId) localStorage.removeItem(seasonKey(s.id)); });
      const m = data.seasons.meta;
      Object.keys(data.seasons.archived || {}).forEach(id=>{
        localStorage.setItem(seasonKey(id), JSON.stringify(data.seasons.archived[id]));
      });
      seasonsMeta = {currentId: m.currentId, list: m.list, nextId: m.nextId || 1};
      if(!seasonsMeta.list.some(s=>s.id===seasonsMeta.currentId)) seasonsMeta.currentId = seasonsMeta.list[0].id;
    }
    // Version 1 (a single season, from before seasons existed): replaces the CURRENT season only;
    // any other seasons are left alone.
    applySnapshot({config: data.config, progress: data.progress}, {includeCards: true});
    loadDateIntoEditor(nextUnplayedDate());
    saveConfig();
    saveProgress();
    saveSeasonsMeta();
  }
  function importBackupFile(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = JSON.parse(e.target.result);
        restoreBackup(data);
        lastSaveMsg = `Backup from ${data.exportedAt ? data.exportedAt.slice(0,10) : 'unknown date'} imported` + (backupIsFull(data) ? ' \u2014 all seasons restored.' : ` into the current season (${currentSeason().name}); other seasons were left alone.`);
        render();
      }catch(err){
        alert('Could not import that file: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  // ---------- Seasons: carry-over, create, switch ----------
  function computeCareerStats(){
    // This season's played games plus whatever was carried in from earlier seasons.
    const season = computeStats();
    const out = {};
    const ids = new Set(Object.keys(baseline).concat(Object.keys(season)));
    ids.forEach(id=>{
      const b = baseline[id] || {games:0, inningsFielded:0, inningsBenched:0, positions:{}};
      const s = season[id] || {games:0, inningsFielded:0, inningsBenched:0, positions:{}};
      const pos = Object.assign({}, b.positions || {});
      Object.keys(s.positions).forEach(k=>{ pos[k] = (pos[k]||0) + s.positions[k]; });
      out[id] = {
        games: (b.games||0) + s.games,
        inningsFielded: (b.inningsFielded||0) + s.inningsFielded,
        inningsBenched: (b.inningsBenched||0) + s.inningsBenched,
        positions: pos
      };
    });
    return out;
  }
  function buildCarryBaseline(){
    // What the NEXT season starts with: each player's career totals so far, plus where they
    // stand in the bench rotation (games since their last turn).
    const career = computeCareerStats();
    const recency = computeBenchRecency();
    const out = {};
    roster.forEach(p=>{
      const s = career[p.id];
      const r = recency[p.id] || 0;
      if(s || r){
        out[p.id] = {
          games: s ? s.games : 0,
          inningsFielded: s ? s.inningsFielded : 0,
          inningsBenched: s ? s.inningsBenched : 0,
          positions: s ? Object.assign({}, s.positions) : {},
          benchRecency: r
        };
      }
    });
    return out;
  }
  function weeklyDates(first, n){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(first || '');
    const out = [];
    n = Math.min(Number(n) || 0, 40);
    if(!m || n < 1) return out;
    let t = Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    for(let i=0;i<n;i++){ out.push(new Date(t).toISOString().slice(0,10)); t += 7*86400000; }
    return out;
  }
  function hasUnsavedLineup(){
    if(!currentGrid) return false;
    const entry = weekLog.find(w=>w.gameDate===selectedGameDate);
    if(!entry) return true;
    return JSON.stringify(entry.grid) !== JSON.stringify(currentGrid) ||
           JSON.stringify(entry.battingOrder) !== JSON.stringify(currentBattingOrder);
  }
  function confirmDiscardUnsaved(){
    return !hasUnsavedLineup() || confirm('There\'s a lineup on the This Week tab that hasn\'t been saved \u2014 changing seasons will discard it. Continue?');
  }
  function archiveCurrentSeason(){
    try{
      localStorage.setItem(seasonKey(seasonsMeta.currentId), JSON.stringify(getSnapshot()));
      return true;
    }catch(e){ console.error('Could not archive season:', e); return false; }
  }
  function seasonSummaryFrom(cfg, prog){
    const dates = (cfg.scheduleDates || []).slice().sort();
    const gd = cfg.gameDetails || {};
    let w=0, l=0, t=0, played=0;
    dates.forEach(d=>{
      const det = gd[d];
      if(!det) return;
      if(det.played) played++;
      const r = gameResult(det);
      if(r==='W') w++; else if(r==='L') l++; else if(r==='T') t++;
    });
    return {
      first: dates[0] || null, last: dates[dates.length-1] || null,
      games: dates.length, scored: w+l+t, w, l, t, played,
      lineups: ((prog && prog.weekLog) || []).length,
      players: (cfg.roster || []).filter(p=>p.active).length
    };
  }

  function blankDraft(){
    return {open:false, name:'', firstDate:'', numGames:'', newPlayers:'', returning:{}, carryRatings:true, carryStats:true, carryCore:true};
  }
  function openNewSeasonDraft(){
    newSeasonDraft = blankDraft();
    newSeasonDraft.open = true;
    roster.forEach(p=>{ newSeasonDraft.returning[p.id] = !!p.active; });
  }

  function createSeason(draft){
    const name = (draft.name || '').trim();
    if(!name){ alert('Give the new season a name first (for example, Spring 2027).'); return false; }
    if(seasonsMeta.list.some(s=>s.name.trim().toLowerCase() === name.toLowerCase())){
      alert('There\'s already a season with that name.'); return false;
    }
    if(!confirmDiscardUnsaved()) return false;

    const prev = getSnapshot();
    const prevId = seasonsMeta.currentId;

    // Build the new season entirely from the current one BEFORE anything is changed.
    const carriedBaseline = draft.carryStats ? buildCarryBaseline() : {};
    const newRoster = roster.map(p=>({
      id: p.id, name: p.name,
      active: (draft.returning && draft.returning[p.id] !== undefined) ? !!draft.returning[p.id] : !!p.active
    }));
    const skipped = [];
    const taken = new Set(newRoster.map(p=>p.name.trim().toLowerCase()));
    let added = 0;
    (draft.newPlayers || '').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean).forEach(n=>{
      const key = n.toLowerCase();
      if(taken.has(key)){ skipped.push(n); return; }
      taken.add(key);
      newRoster.push({id: uid(), name: n, active: true});
      added++;
    });
    const ids = new Set(newRoster.map(p=>p.id));
    const keepOnly = obj => { const o = {}; Object.keys(obj).forEach(k=>{ if(ids.has(k)) o[k] = deepCopy(obj[k]); }); return o; };
    const next = {
      config: {
        roster: newRoster,
        positions: positions.slice(),
        innings,
        battingPointer: 0,
        preferredPositions: draft.carryRatings ? keepOnly(preferredPositions) : {},
        excludedPositions: draft.carryRatings ? keepOnly(excludedPositions) : {},
        generalSkills: draft.carryRatings ? keepOnly(generalSkills) : {},
        scheduleDates: weeklyDates(draft.firstDate, draft.numGames),
        attendance: {},
        gameDetails: {},
        neverBenchByDate: {},
        coreGroup: draft.carryCore ? keepOnly(coreGroup) : {},
        baseline: keepOnly(carriedBaseline)
      },
      progress: {weekLog: []}
    };

    if(!archiveCurrentSeason()){
      alert('Could not save the current season before starting a new one \u2014 browser storage may be full. Nothing was changed. Try downloading a backup and removing old photos or park maps.');
      return false;
    }
    const newId = 's' + Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36);
    seasonsMeta.list.push({id: newId, name, createdAt: todayStr()});
    seasonsMeta.currentId = newId;
    applySnapshot(next);
    if(!(saveConfig() && saveProgress())){
      seasonsMeta.list.pop();
      seasonsMeta.currentId = prevId;
      applySnapshot(prev);
      saveConfig(); saveProgress();
      localStorage.removeItem(seasonKey(prevId));
      alert('Could not create the season \u2014 browser storage looks full. Nothing was changed.');
      render();
      return false;
    }
    newSeasonDraft = blankDraft();
    seasonMsg = `Created ${name}. ` +
      `${newRoster.filter(p=>p.active).length} active players` +
      (added ? ` (${added} new)` : '') +
      (scheduleDates.length ? `, ${scheduleDates.length} game dates` : ', no game dates yet \u2014 add them on the Attendance tab') +
      (draft.carryStats ? '; stats carried over' : '') + '.' +
      (skipped.length ? ` Skipped ${skipped.join(', ')} \u2014 already on the roster.` : '') +
      ` ${seasonsMeta.list.find(s=>s.id===prevId).name} is saved \u2014 switch back any time.`;
    activeTab = 'seasons';
    loadDateIntoEditor(nextUnplayedDate());
    render();
    return true;
  }

  function switchSeason(targetId){
    if(!targetId || targetId === seasonsMeta.currentId) return false;
    const target = loadSeasonSnapshot(targetId);
    if(!target){ alert('Could not find saved data for that season.'); render(); return false; }
    if(!confirmDiscardUnsaved()){ render(); return false; }
    const prev = getSnapshot();
    const prevId = seasonsMeta.currentId;
    if(!archiveCurrentSeason()){
      alert('Could not save the current season before switching \u2014 browser storage may be full. Nothing was changed.');
      render();
      return false;
    }
    applySnapshot(target);
    seasonsMeta.currentId = targetId;
    if(!(saveConfig() && saveProgress())){
      seasonsMeta.currentId = prevId;
      applySnapshot(prev);
      saveConfig(); saveProgress();
      localStorage.removeItem(seasonKey(prevId));
      alert('Could not switch seasons \u2014 browser storage looks full. Nothing was changed.');
      render();
      return false;
    }
    localStorage.removeItem(seasonKey(targetId));   // it's the current season now, so its data lives in the main keys
    seasonMsg = '';
    loadDateIntoEditor(nextUnplayedDate());
    render();
    return true;
  }

  function deleteSeason(id){
    if(id === seasonsMeta.currentId) return false;
    const s = seasonsMeta.list.find(x=>x.id===id);
    if(!s) return false;
    if(!confirm(`Permanently delete ${s.name} and all of its schedule, scores, and lineups? This can't be undone (download a backup first if you're not sure).`)) return false;
    localStorage.removeItem(seasonKey(id));
    seasonsMeta.list = seasonsMeta.list.filter(x=>x.id!==id);
    saveSeasonsMeta();
    seasonMsg = `Deleted ${s.name}.`;
    render();
    return true;
  }
  function renameSeason(id, name){
    const s = seasonsMeta.list.find(x=>x.id===id);
    name = (name || '').trim();
    if(!s || !name) { render(); return false; }
    if(seasonsMeta.list.some(x=>x.id!==id && x.name.trim().toLowerCase()===name.toLowerCase())){
      alert('There\'s already a season with that name.'); render(); return false;
    }
    s.name = name;
    saveSeasonsMeta();
    render();
    return true;
  }

  function activeRoster(){ return roster.filter(p=>p.active); }
  function playerName(id){ const p = roster.find(x=>x.id===id); return p ? p.name : '\u2014'; }
  const CENTER_OF = ['LCF','RCF'];
  const CORNER_OF = ['LF','RF'];
  function preferenceRank(id, pos){
    // Returns 1, 2, or 3 if this player has ranked `pos` as that choice, else null.
    // Center/Corner outfield tags apply equally to either side of that grouping.
    const map = preferredPositions[id] || {};
    const groupTag = CENTER_OF.includes(pos) ? 'Center Outfield' : CORNER_OF.includes(pos) ? 'Corner Outfield' : null;
    for(let r=1; r<=3; r++){
      const val = map[r];
      if(val === pos || (groupTag && val === groupTag)) return r;
    }
    return null;
  }
  function setPreferenceRank(playerId, rank, value){
    if(!preferredPositions[playerId]) preferredPositions[playerId] = {};
    const map = preferredPositions[playerId];
    if(value === 'None'){
      delete map[rank];
    } else {
      for(let r=1; r<=3; r++){
        if(r!==rank && map[r]===value){
          alert(`${value} is already this player's #${r} choice. Pick a different position, or clear that one first.`);
          render();
          return;
        }
      }
      if(excludedPositions[playerId] && excludedPositions[playerId].includes(value)){
        alert(`${value} is currently marked as a position this player never plays \u2014 clear that exclusion first if you want to prefer it.`);
        render();
        return;
      }
      map[rank] = value;
    }
    saveConfig();
    render();
  }
  function preferenceColumns(){
    // Collapses LCF/RCF into one "Center Outfield" tag and LF/RF into one "Corner Outfield"
    // tag, since side doesn't matter \u2014 each still counts as just one of a player's 3 ranked choices.
    const cols = [];
    let addedCenter = false, addedCorner = false;
    positions.forEach(pos=>{
      if(CENTER_OF.includes(pos)){
        if(!addedCenter){ cols.push('Center Outfield'); addedCenter = true; }
      } else if(CORNER_OF.includes(pos)){
        if(!addedCorner){ cols.push('Corner Outfield'); addedCorner = true; }
      } else {
        cols.push(pos);
      }
    });
    return cols;
  }

  const OUTFIELD_POSITIONS = CENTER_OF.concat(CORNER_OF); // ['LCF','RCF','LF','RF']
  function skillFitScore(id, pos){
    // Outfield leans on Catching + Running; everything else (infield, Pitcher, Catcher)
    // leans on Throwing + Decision Making.
    if(OUTFIELD_POSITIONS.includes(pos)){
      return (generalSkillFor(id,'Catching') + generalSkillFor(id,'Running')) / 2;
    }
    return (generalSkillFor(id,'Throwing') + generalSkillFor(id,'Decision Making')) / 2;
  }
  function preferenceBonus(id, pos){
    const r = preferenceRank(id, pos);
    return r === 1 ? 3 : r === 2 ? 2 : r === 3 ? 1 : 0;
  }
  function combinedScore(id, pos){
    return skillFitScore(id, pos) + preferenceBonus(id, pos);
  }
  function isExcluded(id, pos){
    return !!(excludedPositions[id] && excludedPositions[id].includes(pos));
  }
  function setExcluded(playerId, pos, excluded){
    if(!excludedPositions[playerId]) excludedPositions[playerId] = [];
    const list = excludedPositions[playerId];
    if(excluded){
      // Block exact contradictions against a ranked preference (only possible for
      // non-outfield positions, since preferred outfield choices are the grouped
      // Center/Corner tags, not individual sides \u2014 those never collide with this check).
      const prefMap = preferredPositions[playerId] || {};
      for(const r of [1,2,3]){
        if(prefMap[r] === pos){
          alert(`${pos} is already this player's #${r} preferred choice \u2014 remove that first if you want to exclude it.`);
          render();
          return;
        }
      }
      if(!list.includes(pos)) list.push(pos);
    } else {
      excludedPositions[playerId] = list.filter(x=>x!==pos);
    }
    saveConfig();
    render();
  }
  function generalSkillFor(id, skillName){
    return (generalSkills[id] && generalSkills[id][skillName] !== undefined) ? generalSkills[id][skillName] : 3;
  }
  function overallSkillFor(id){
    return GENERAL_SKILLS.reduce((sum,sk)=> sum + generalSkillFor(id,sk), 0) / GENERAL_SKILLS.length;
  }

  // ---------- Lineup generation ----------
  function generateLineup(){
    const active = activePlayersForDate(selectedGameDate);
    const warnings = [];
    if(active.length === 0){ lastWarning = 'No players available for this date \u2014 check the Roster and Attendance tabs.'; render(); return; }
    let posList = positions.slice();
    if(active.length < posList.length){
      posList = posList.slice(0, active.length);
      warnings.push(`Only ${active.length} active player(s) for ${positions.length} positions \u2014 using the first ${posList.length} positions this week.`);
    }
    const P = posList.length;
    const N = active.length;
    const benchPerInning = Math.max(0, N - P);

    const workingFielded = {};
    const workingPos = {};
    const statsNow = computeStats();         // this season only \u2014 fairness catch-up shouldn't make new players look "behind"
    const careerNow = computeCareerStats();  // includes carried-over seasons \u2014 so players stay in the positions they know
    active.forEach(p=>{
      const s = statsNow[p.id] || {inningsFielded:0};
      workingFielded[p.id] = s.inningsFielded;
      workingPos[p.id] = Object.assign({}, (careerNow[p.id] && careerNow[p.id].positions) || {});
    });

    // Bench selection priority, in order:
    //   1. Fewest bench turns THIS GAME so far goes first \u2014 nobody takes a 2nd turn while
    //      anyone (protected or not) is still on 0 turns, nobody takes a 3rd while anyone's
    //      still on 1, etc. This is the core fairness rule and applies to everyone equally.
    //   2. Within a tie on turns-so-far, an unprotected player is picked over a "Never Bench"
    //      player \u2014 that's what Never Bench actually does: it's the tiebreaker that keeps
    //      protected players in longer, not an exemption from the queue. If every unprotected
    //      player already has as many turns as a protected player, the protected player is
    //      no longer spared \u2014 forcing an unprotected player into an extra turn instead would
    //      be the exact unfairness this is meant to avoid.
    //   3. Within the same tier and protection status, season-level recency (see
    //      computeBenchRecency) keeps rotation fair across games, not just within this one.
    //   4. A random tiebreak so nothing is permanently biased by player order.
    const benchRecency = computeBenchRecency();
    const inGameBenchTurns = {};
    active.forEach(p=> inGameBenchTurns[p.id] = 0);
    let exclusionFallbackWarned = false;
    const benchSortKey = (a,b)=>{
      const ta = inGameBenchTurns[a.id]||0, tb = inGameBenchTurns[b.id]||0;
      if(ta!==tb) return ta-tb;
      const pa = isNeverBenchThisDate(selectedGameDate, a.id) ? 1 : 0;
      const pb = isNeverBenchThisDate(selectedGameDate, b.id) ? 1 : 0;
      if(pa!==pb) return pa-pb;
      const ra = benchRecency[a.id]||0, rb = benchRecency[b.id]||0;
      if(ra!==rb) return rb-ra;
      return Math.random()-0.5;
    };

    const grid = [];
    for(let i=0;i<innings;i++){
      const sorted = active.slice().sort(benchSortKey);
      const benchIds = sorted.slice(0, benchPerInning).map(p=>p.id);
      benchIds.forEach(id=>{ inGameBenchTurns[id] = (inGameBenchTurns[id]||0) + 1; });

      let pool = active.filter(p=>!benchIds.includes(p.id));
      const posAssign = {};
      let remainingPositions = posList.slice();
      while(remainingPositions.length){
        // Fill the most-constrained position first (fewest non-excluded candidates left) so a
        // player's exclusion isn't violated just because of which order positions happen to be
        // processed in \u2014 that was the bug where an excluded spot got assigned anyway even
        // though a valid full assignment existed.
        let pos = null, eligible = null;
        remainingPositions.forEach(candPos=>{
          const c = pool.filter(p=>!isExcluded(p.id,candPos));
          if(pos === null || c.length < eligible.length){ pos = candPos; eligible = c; }
        });
        let candidates = eligible;
        if(candidates.length === 0){
          candidates = pool.slice();
          if(!exclusionFallbackWarned){
            warnings.push(`Position exclusions left no eligible player for at least one spot \u2014 had to assign someone anyway.`);
            exclusionFallbackWarned = true;
          }
        }
        candidates.sort((a,b)=>{
          const scoreA = combinedScore(a.id,pos), scoreB = combinedScore(b.id,pos);
          if(scoreA !== scoreB) return scoreB - scoreA; // higher skill-fit + preference wins
          const consistA = workingPos[a.id][pos]||0, consistB = workingPos[b.id][pos]||0;
          if(consistA !== consistB) return consistB - consistA; // prefer keeping them where they've played before
          return workingFielded[a.id]-workingFielded[b.id]; // then fairness catch-up
        });
        const chosen = candidates[0];
        posAssign[pos] = chosen.id;
        pool = pool.filter(p=>p.id !== chosen.id);
        remainingPositions = remainingPositions.filter(p=>p!==pos);
        workingPos[chosen.id][pos] = (workingPos[chosen.id][pos]||0)+1;
        workingFielded[chosen.id] += 1;
      }
      grid.push({positions: posAssign});
    }
    currentGrid = grid;
    currentPosList = posList.slice();
    lastWarning = warnings.join(' ');
    const order = active.slice();
    const ptr = order.length ? battingPointer % order.length : 0;
    currentBattingOrder = order.slice(ptr).concat(order.slice(0,ptr)).map(p=>p.id);
    render();
  }

  function benchForInning(inningIdx){
    const active = activePlayersForDate(selectedGameDate).map(p=>p.id);
    const assigned = Object.values(currentGrid[inningIdx].positions);
    return active.filter(id => !assigned.includes(id));
  }

  function assignmentFor(playerId, inningIdx){
    const posMap = currentGrid[inningIdx].positions;
    for(const pos in posMap){
      if(posMap[pos] === playerId) return pos;
    }
    return 'Bench';
  }

  function inningSignature(inning){
    return Object.keys(inning.positions).sort().map(pos=>`${pos}:${inning.positions[pos]}`).join('|');
  }

  function groupUniqueInningLayouts(grid){
    // Returns [{inning, innings:[1,2,...]}] \u2014 one entry per distinct layout, in first-seen order.
    const groups = [];
    const bySig = {};
    grid.forEach((inning, idx)=>{
      const sig = inningSignature(inning);
      if(!bySig[sig]){
        bySig[sig] = {inning, innings: []};
        groups.push(bySig[sig]);
      }
      bySig[sig].innings.push(idx+1);
    });
    return groups;
  }

  function condenseInningRanges(nums){
    if(!nums.length) return '';
    const sorted = nums.slice().sort((a,b)=>a-b);
    const ranges = [];
    let start = sorted[0], prev = sorted[0];
    for(let i=1;i<=sorted.length;i++){
      if(i<sorted.length && sorted[i]===prev+1){ prev = sorted[i]; continue; }
      ranges.push(start===prev ? `${start}` : `${start}\u2013${prev}`);
      if(i<sorted.length){ start = sorted[i]; prev = sorted[i]; }
    }
    return ranges.join(', ');
  }

  const FIELD_POS_COORDS = {
    Catcher: [0.50, 0.92],
    Pitcher: [0.50, 0.70],
    '1B': [0.76, 0.58],
    '2B': [0.50, 0.40],
    '3B': [0.24, 0.58],
    SS: [0.40, 0.48],
    LF: [0.14, 0.20],
    LCF: [0.36, 0.06],
    RCF: [0.64, 0.06],
    RF: [0.86, 0.20]
  };

  function setPlayerAssignment(playerId, inningIdx, newValue){
    // Moving a player to a position someone else holds is a SWAP: the other player takes
    // the mover's old spot (or goes to the bench if the mover was benched). Setting a
    // fielder to Bench leaves their position vacant \u2014 there's no way to know who should
    // replace them, so it's flagged in red rather than silently refilled.
    const posMap = currentGrid[inningIdx].positions;
    const oldPos = assignmentFor(playerId, inningIdx); // a position name, or 'Bench'
    if(newValue === oldPos) return;

    if(newValue === 'Bench'){
      if(oldPos !== 'Bench') delete posMap[oldPos];
    } else {
      const occupant = posMap[newValue]; // undefined if that position is currently vacant
      if(oldPos !== 'Bench') delete posMap[oldPos];
      posMap[newValue] = playerId;
      if(occupant && occupant !== playerId && oldPos !== 'Bench'){
        posMap[oldPos] = occupant; // the swap
      }
      // if the mover was benched, the displaced occupant simply ends up on the bench
    }
    render();
  }

  function vacantPositionsForInning(inningIdx){
    const posMap = currentGrid[inningIdx].positions;
    return currentPosList.filter(pos => !posMap[pos]);
  }
  function allVacancies(){
    // [{inning: 1-based number, positions: [...]}] for every inning with an empty position
    const out = [];
    if(!currentGrid) return out;
    currentGrid.forEach((inn, idx)=>{
      const v = vacantPositionsForInning(idx);
      if(v.length) out.push({inning: idx+1, positions: v});
    });
    return out;
  }

  function suggestBattingOrderBySkill(){
    const ids = currentBattingOrder.slice();
    const N = ids.length;
    if(N === 0) return;

    // Spread big kickers evenly through the order (never leadoff) instead of stacking them together.
    const powerCount = Math.min(N, Math.max(1, Math.round(N/3)));
    const byPower = ids.slice().sort((a,b)=> generalSkillFor(b,'Big Kicks') - generalSkillFor(a,'Big Kicks'));
    const powerHitters = byPower.slice(0, powerCount);
    const powerSet = new Set(powerHitters);

    const slots = new Array(N).fill(null);

    // Leadoff goes to a weaker/medium overall-skill player, not a power hitter \u2014 the top
    // of the order just needs to get on base, so it doesn't need to be your best player.
    const leadoffCandidates = ids.filter(id=>!powerSet.has(id)).sort((a,b)=> overallSkillFor(a) - overallSkillFor(b));
    const leadoff = leadoffCandidates.length ? leadoffCandidates[0] : ids.find(id=>!powerSet.has(id));
    if(leadoff !== undefined) slots[0] = leadoff;

    // Everyone else, ranked by who's best at getting on base and reading the play.
    const onBaseQueue = ids.filter(id=>!powerSet.has(id) && id!==leadoff).sort((a,b)=>
      (generalSkillFor(b,'Running')+generalSkillFor(b,'Decision Making')) -
      (generalSkillFor(a,'Running')+generalSkillFor(a,'Decision Making'))
    );

    const step = N / (powerCount + 1);
    const takenSlots = new Set();
    const powerSlotIdx = [];
    for(let i=1;i<=powerCount;i++){
      let idx = Math.round(step*i) - 1;
      idx = Math.max(1, Math.min(N-1, idx)); // never leadoff (index 0)
      while(takenSlots.has(idx) && idx < N-1) idx++;
      while(takenSlots.has(idx) && idx > 1) idx--;
      takenSlots.add(idx);
      powerSlotIdx.push(idx);
    }
    powerSlotIdx.sort((a,b)=>a-b);
    powerHitters.forEach((id,i)=>{ slots[powerSlotIdx[i]] = id; });

    // Pack the bases: put your best remaining on-base player right before each power slot
    // (skips slot 0 automatically since it's already filled with the leadoff pick above).
    powerSlotIdx.forEach(idx=>{
      const feeder = idx - 1;
      if(feeder >= 0 && slots[feeder] === null && onBaseQueue.length){
        slots[feeder] = onBaseQueue.shift();
      }
    });

    // Fill everything else left to right, best remaining on-base skill first.
    for(let i=0;i<N;i++){
      if(slots[i] === null) slots[i] = onBaseQueue.length ? onBaseQueue.shift() : null;
    }
    const used = new Set(slots.filter(Boolean));
    const leftover = ids.filter(id=>!used.has(id));
    for(let i=0;i<N;i++){
      if(slots[i] === null) slots[i] = leftover.shift();
    }

    currentBattingOrder = slots;
    render();
  }

  function buildLineupText(){
    const details = ensureGameDetails(selectedGameDate);
    const extras = [];
    if(details.field) extras.push(details.field);
    if(details.time) extras.push(details.time);
    if(details.opponent) extras.push(`vs ${details.opponent}`);
    const lines = [];
    lines.push(`${team.name ? team.name + ' \u2014 ' : ''}Lineup \u2014 ${fmtDate(selectedGameDate) || 'draft'}${extras.length ? ' (' + extras.join(', ') + ')' : ''} \u2014 ${innings} innings`);
    lines.push('');
    lines.push('Batting Order:');
    currentBattingOrder.forEach((id, idx)=> lines.push(`${idx+1}. ${playerName(id)}`));
    lines.push('');
    lines.push('Fielding by inning:');
    currentBattingOrder.forEach(id=>{
      const cells = [];
      for(let i=0;i<innings;i++) cells.push(`I${i+1}: ${assignmentFor(id,i)}`);
      lines.push(`${playerName(id)} \u2014 ${cells.join(', ')}`);
    });
    return lines.join('\n');
  }

  const cardFileName = p => `card-${p.name.replace(/\s+/g,'_')}.jpg`;
  async function downloadPlayerCard(playerId){

  async function buildPlayerCardBlob(playerId){
    const player = roster.find(p=>p.id===playerId);
    if(!player) return null;
    const cardData = ensurePlayerCard(playerId);
    const th = themeFor();
    const img = await loadImageSrc(cardData.photo);
    const logoImg = await loadImageSrc(team.logo);

    const W = 400, H = 560, inset = 14;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    // Border frame
    ctx.fillStyle = th.field;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#FBF6EC';
    ctx.fillRect(inset, inset, W-inset*2, H-inset*2);

    // Photo area (cover-fit crop if a photo was uploaded)
    const photoX = inset+10, photoY = inset+10, photoW = W-inset*2-20, photoH = 360;
    ctx.fillStyle = '#DCD3BE';
    ctx.fillRect(photoX, photoY, photoW, photoH);
    if(img){
      const scale = Math.max(photoW/img.width, photoH/img.height);
      const iw = img.width*scale, ih = img.height*scale;
      const ix = photoX + (photoW-iw)/2, iy = photoY + (photoH-ih)/2;
      ctx.save();
      ctx.beginPath();
      ctx.rect(photoX, photoY, photoW, photoH);
      ctx.clip();
      ctx.drawImage(img, ix, iy, iw, ih);
      ctx.restore();
    } else {
      ctx.fillStyle = '#8A8A8A';
      ctx.font = '14px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('No photo uploaded', photoX+photoW/2, photoY+photoH/2);
      ctx.textAlign = 'left';
    }
    ctx.strokeStyle = th.fieldDark;
    ctx.lineWidth = 3;
    ctx.strokeRect(photoX, photoY, photoW, photoH);
    ctx.lineWidth = 1;

    // Team logo badge, top-right of the photo
    if(logoImg){
      const cx = photoX + photoW - 40, cy = photoY + 40, rad = 34;
      ctx.fillStyle = '#FBF6EC';
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = th.field; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2); ctx.stroke();
      ctx.lineWidth = 1;
      const fit = containFit(logoImg, 50, 50);
      ctx.drawImage(logoImg, cx - fit.w/2, cy - fit.h/2, fit.w, fit.h);
    }

    // Nameplate banner
    const bannerY = photoY + photoH + 14;
    ctx.fillStyle = th.ball;
    ctx.fillRect(photoX, bannerY, photoW, 56);
    ctx.fillStyle = th.onBall;
    ctx.font = 'bold 26px Oswald, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(player.name.toUpperCase(), photoX+photoW/2, bannerY+37);

    // Tagline
    ctx.fillStyle = '#1C2B24';
    ctx.font = 'italic 15px "JetBrains Mono", monospace';
    ctx.fillText(cardData.tagline || '', photoX+photoW/2, bannerY+56+30);

    // Footer: team name + season
    if(team.name){
      ctx.strokeStyle = th.field; ctx.globalAlpha = 0.35;
      ctx.beginPath(); ctx.moveTo(photoX, 499); ctx.lineTo(photoX+photoW, 499); ctx.stroke();
      ctx.globalAlpha = 1;
      let fs = 14;
      ctx.fillStyle = th.fieldDark;
      do { ctx.font = `bold ${fs}px Oswald, Arial, sans-serif`; fs--; } while(ctx.measureText(team.name.toUpperCase()).width > photoW && fs > 8);
      ctx.fillText(team.name.toUpperCase(), W/2, 520);
      ctx.fillStyle = '#5B6E63';
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillText(currentSeason().name, W/2, 537);
    }
    ctx.textAlign = 'left';

    return new Promise((resolve)=> canvas.toBlob(resolve, 'image/jpeg', 0.92));
  }

  function drawFieldDiagram(ctx, x, y, w, h, inning, label){
    const th = themeFor();
    ctx.fillStyle = '#1C2B24';
    ctx.font = 'bold 12px Oswald, Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(label, x, y+14);

    const fieldTop = y+20, fieldH = h-24;
    ctx.fillStyle = mixHex(th.field, '#FFFFFF', 0.86);
    ctx.fillRect(x, fieldTop, w, fieldH);
    ctx.strokeStyle = th.field;
    ctx.strokeRect(x, fieldTop, w, fieldH);

    const coord = (key)=>{
      const c = FIELD_POS_COORDS[key];
      return c ? [x + c[0]*w, fieldTop + c[1]*fieldH] : null;
    };
    const home = coord('Catcher'), first = coord('1B'), second = coord('2B'), third = coord('3B');
    if(home && first && second && third){
      ctx.strokeStyle = '#C9A66B';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(home[0],home[1]);
      ctx.lineTo(first[0],first[1]);
      ctx.lineTo(second[0],second[1]);
      ctx.lineTo(third[0],third[1]);
      ctx.closePath();
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    Object.entries(inning.positions).forEach(([pos,id])=>{
      const c = coord(pos);
      if(!c) return;
      const [px,py] = c;
      ctx.fillStyle = th.ballText;
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#1C2B24';
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(playerName(id), px, py + 16);
    });
    ctx.textAlign = 'left';
  }

  function saveBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
  }
  function canShareFiles(){
    // True on phones/tablets whose browser can hand a file to the share sheet (Messages, WhatsApp, ...).
    try{
      return !!(navigator.share && navigator.canShare && navigator.canShare({files: [new File(['x'], 'x.jpg', {type: 'image/jpeg'})]}));
    }catch(e){ return false; }
  }
  async function shareBlob(blob, filename, title){
    try{
      await navigator.share({files: [new File([blob], filename, {type: 'image/jpeg'})], title});
    }catch(e){
      if(e && e.name === 'AbortError') return;      // they closed the share sheet \u2014 nothing went wrong
      saveBlob(blob, filename);                       // anything else: fall back to a normal download
    }
  }
  const lineupFileName = ()=> `lineup-${selectedGameDate || 'draft'}.jpg`;
  async function exportLineupImage(){
    const blob = await buildLineupBlob();
    if(blob) saveBlob(blob, lineupFileName());
  }
  async function shareLineupImage(){
    const blob = await buildLineupBlob();
    if(blob) await shareBlob(blob, lineupFileName(), (team.name ? team.name + ' \u2014 ' : '') + 'Lineup ' + (fmtDate(selectedGameDate) || ''));
  }
  async function buildLineupBlob(){
    if(!currentGrid || !currentBattingOrder.length) return null;
    const ids = currentBattingOrder;
    const details = ensureGameDetails(selectedGameDate);
    const nameColW = 160, cellW = 82, rowH = 32, pad = 18;
    const tableWidth = nameColW + cellW*innings + pad*2;

    const diagCellW = 220, diagCellH = 210, diagGap = 14, diagPerRow = 3;
    const uniqueLayouts = groupUniqueInningLayouts(currentGrid);
    const diagRows = Math.ceil(uniqueLayouts.length / diagPerRow);
    const diagRowWidth = diagPerRow*diagCellW + (diagPerRow-1)*diagGap + pad*2;

    const th = themeFor();
    const subLine = [];
    if(details.field) subLine.push(details.field);
    if(details.time) subLine.push(details.time);
    if(details.opponent) subLine.push(`vs ${details.opponent}`);

    const logoImg = await loadImageSrc(team.logo);
    const dateTxt = fmtDate(selectedGameDate) || 'draft';
    const lineSpecs = [];
    if(team.name){
      lineSpecs.push({text: team.name.toUpperCase(), font: 'bold 24px Oswald, Arial, sans-serif'});
      lineSpecs.push({text: `Lineup \u2014 ${dateTxt} \u00b7 ${currentSeason().name}`, font: 'bold 15px Oswald, Arial, sans-serif'});
    } else {
      lineSpecs.push({text: `Lineup \u2014 ${dateTxt}`, font: 'bold 22px Oswald, Arial, sans-serif'});
    }
    lineSpecs.push({text: `${innings} innings \u00b7 ${ids.length} players \u00b7 batting order = row order`, font: '13px "JetBrains Mono", monospace'});
    if(subLine.length) lineSpecs.push({text: subLine.join('   \u00b7   '), font: '13px "JetBrains Mono", monospace'});
    const lineGap = 22;
    const headerH = Math.max(34 + (lineSpecs.length-1)*lineGap + 20, logoImg ? 92 : 0);
    const lg = logoImg ? containFit(logoImg, 140, Math.min(68, headerH - 24)) : null;
    const badgeW = lg ? lg.w + 12 : 0, badgeH = lg ? lg.h + 12 : 0;
    const textX = lg ? pad + badgeW + 16 : pad;
    const measure = document.createElement('canvas').getContext('2d');
    const headerNeedW = textX + Math.max(...lineSpecs.map(l=>{ measure.font = l.font; return measure.measureText(l.text).width; })) + pad;
    const width = Math.max(tableWidth, diagRowWidth, Math.ceil(headerNeedW));

    let mapImg = null, mapH = 0;
    if(details.mapImage){
      mapImg = await new Promise((resolve)=>{
        const img = new Image();
        img.onload = ()=> resolve(img);
        img.onerror = ()=> resolve(null);
        img.src = details.mapImage;
      });
      if(mapImg){
        const scale = Math.min(1, (width - pad*2) / mapImg.width);
        mapH = Math.round(mapImg.height*scale) + 16;
      }
    }

    const tableH = rowH*(ids.length+1);
    const diagTitleH = uniqueLayouts.length ? 30 : 0;
    const diagSectionH = uniqueLayouts.length ? diagTitleH + diagRows*diagCellH + pad : 0;
    const height = headerH + mapH + tableH + diagSectionH + pad;

    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#FBF6EC'; ctx.fillRect(0,0,width,height);
    ctx.fillStyle = th.field; ctx.fillRect(0,0,width,headerH);
    ctx.fillStyle = th.ball; ctx.fillRect(0, headerH-4, width, 4);
    if(lg){
      const bx = pad, by = Math.round((headerH - 4 - badgeH) / 2);
      ctx.fillStyle = '#FBF6EC';
      roundedRectPath(ctx, bx, by, badgeW, badgeH, 10);
      ctx.fill();
      ctx.drawImage(logoImg, bx + 6, by + 6, lg.w, lg.h);
    }
    ctx.fillStyle = th.onField;
    lineSpecs.forEach((l, i)=>{ ctx.font = l.font; ctx.fillText(l.text, textX, 34 + i*lineGap); });

    let y = headerH;
    if(mapImg){
      const scale = Math.min(1, (width - pad*2) / mapImg.width);
      const w = Math.round(mapImg.width*scale), h = Math.round(mapImg.height*scale);
      ctx.drawImage(mapImg, pad, y+8, w, h);
      y += mapH;
    }

    ctx.fillStyle = '#C9A66B'; ctx.fillRect(0, y, width, rowH);
    ctx.fillStyle = th.fieldDark;
    ctx.font = 'bold 12px Oswald, Arial, sans-serif';
    ctx.fillText('Player', pad, y+21);
    for(let i=0;i<innings;i++){
      ctx.fillText(`Inn ${i+1}`, nameColW + i*cellW + 10, y+21);
    }
    y += rowH;

    ids.forEach((id, idx)=>{
      ctx.fillStyle = idx%2===0 ? '#FFFFFF' : '#F3ECD9';
      ctx.fillRect(0, y, width, rowH);
      ctx.strokeStyle = '#DCD3BE';
      ctx.strokeRect(0, y, width, rowH);
      ctx.fillStyle = '#1C2B24';
      ctx.font = 'bold 12px "JetBrains Mono", monospace';
      ctx.fillText(`${idx+1}. ${playerName(id)}`, pad, y+21);
      ctx.font = '12px "JetBrains Mono", monospace';
      for(let i=0;i<innings;i++){
        const pos = assignmentFor(id, i);
        ctx.fillStyle = pos === 'Bench' ? '#8A8A8A' : '#1C2B24';
        ctx.fillText(pos, nameColW + i*cellW + 10, y+21);
        ctx.strokeStyle = '#DCD3BE';
        ctx.strokeRect(nameColW + i*cellW, y, cellW, rowH);
      }
      y += rowH;
    });

    if(uniqueLayouts.length){
      ctx.fillStyle = th.fieldDark;
      ctx.font = 'bold 14px Oswald, Arial, sans-serif';
      ctx.fillText('FIELD POSITIONS BY INNING', pad, y+22);
      y += diagTitleH;
      uniqueLayouts.forEach((g, i)=>{
        const col = i % diagPerRow, row = Math.floor(i / diagPerRow);
        const dx = pad + col*(diagCellW+diagGap);
        const dy = y + row*diagCellH;
        const label = g.innings.length>1 ? `Innings ${condenseInningRanges(g.innings)}` : `Inning ${g.innings[0]}`;
        drawFieldDiagram(ctx, dx, dy, diagCellW-diagGap, diagCellH-diagGap, g.inning, label);
      });
    }

    return new Promise((resolve)=> canvas.toBlob(resolve, 'image/jpeg', 0.92));
  }

  function moveBattingOrder(idx, dir){
    const j = idx + dir;
    if(j<0 || j>=currentBattingOrder.length) return;
    const tmp = currentBattingOrder[idx];
    currentBattingOrder[idx] = currentBattingOrder[j];
    currentBattingOrder[j] = tmp;
    render();
  }

  async function saveLineup(){
    if(!currentGrid) return;
    const active = activePlayersForDate(selectedGameDate);
    const weekNum = scheduleDates.indexOf(selectedGameDate) + 1;
    const label = (weekNum > 0 ? `Week ${weekNum}` : 'Lineup') + (selectedGameDate ? ' \u2014 ' + fmtDate(selectedGameDate) : '');
    const existingIdx = weekLog.findIndex(w=>w.gameDate===selectedGameDate);
    const entry = {
      label,
      date: new Date().toISOString().slice(0,10),
      gameDate: selectedGameDate,
      innings,
      positions: positions.slice(),
      posList: currentPosList.slice(),
      grid: JSON.parse(JSON.stringify(currentGrid)),
      battingOrder: currentBattingOrder.slice(),
      activeIds: active.map(p=>p.id),
      neverBenchIds: Object.keys(neverBenchByDate[selectedGameDate] || {})
    };
    if(existingIdx >= 0) weekLog[existingIdx] = entry; else weekLog.push(entry);
    battingPointer = (battingPointer + 1) % Math.max(1, active.length);
    const vacancies = allVacancies();
    const vacancyNote = vacancies.length
      ? ' Heads up \u2014 saved with empty positions: ' + vacancies.map(v=>`inning ${v.inning} (${v.positions.join(', ')})`).join('; ') + '.'
      : '';
    lastSaveMsg = `${label} saved.` + (isGamePlayed(selectedGameDate) ? ' (This game is marked played \u2014 stats already reflect it.)' : ' Tick Played in the Attendance tab Schedule once the game happens to fold it into season stats.') + vacancyNote;
    await saveConfig();
    await saveProgress();
    render();
  }

  // ---------- Rendering ----------
  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---------- Team identity & theme ----------
  // The team's name, logo and colors are global (like player photos) \u2014 they don't change when a
  // new season starts. Every text-on-color pair is recomputed for contrast, so a pale or very dark
  // team color can never make the header, tabs, or buttons unreadable.
  function validHex(h){ return typeof h === 'string' && /^#[0-9a-fA-F]{6}$/.test(h); }
  function hexToRgb(h){ const n = parseInt(h.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; }
  function rgbToHex(r, g, b){ return '#' + [r,g,b].map(v=> Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join(''); }
  function relLum(h){
    const [r,g,b] = hexToRgb(h).map(v=>{ v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); });
    return 0.2126*r + 0.7152*g + 0.0722*b;
  }
  function contrastRatio(a, b){
    const la = relLum(a), lb = relLum(b);
    return (Math.max(la,lb) + 0.05) / (Math.min(la,lb) + 0.05);
  }
  function mixHex(a, b, amt){
    const x = hexToRgb(a), y = hexToRgb(b);
    return rgbToHex(x[0]+(y[0]-x[0])*amt, x[1]+(y[1]-x[1])*amt, x[2]+(y[2]-x[2])*amt);
  }
  function ensureContrast(hex, bg, min){
    let c = hex;
    for(let i=0; i<40 && contrastRatio(c, bg) < min; i++) c = mixHex(c, '#000000', 0.08);
    return c;
  }
  function onColor(bg){
    // Prefer the app's cream/ink for looks; fall back to pure white/black when a mid-tone color
    // can't reach readable contrast with either (cream/ink top out around 3.7:1 near mid-gray).
    const options = ['#FBF6EC', '#1C2B24', '#FFFFFF', '#000000'];
    const ok = options.find(o => contrastRatio(bg, o) >= 4.5);
    if(ok) return ok;
    return options.reduce((best, o)=> contrastRatio(bg, o) > contrastRatio(bg, best) ? o : best, options[0]);
  }

  function themeFor(t){
    t = t || team;
    const p = validHex(t.primary) ? t.primary : TEAM_DEFAULTS.primary;
    const a = validHex(t.accent) ? t.accent : TEAM_DEFAULTS.accent;
    const fieldDark = ensureContrast(mixHex(p, '#000000', 0.32), '#C9A66B', 4.5);
    const ballDark = ensureContrast(mixHex(a, '#000000', 0.22), '#FDECEA', 4.5);
    return {
      field: p, fieldDark, ball: a, ballDark,
      ballText: ensureContrast(a, '#FBF6EC', 3),
      onField: onColor(p), onFieldDark: onColor(fieldDark), onBall: onColor(a), onBallDark: onColor(ballDark),
      isDefault: p.toLowerCase() === TEAM_DEFAULTS.primary.toLowerCase() && a.toLowerCase() === TEAM_DEFAULTS.accent.toLowerCase()
    };
  }
  function themeStyle(){
    const th = themeFor();
    if(th.isDefault) return '';
    return `--field:${th.field};--field-dark:${th.fieldDark};--ball:${th.ball};--ball-dark:${th.ballDark};--ball-text:${th.ballText};--on-field:${th.onField};--on-field-dark:${th.onFieldDark};--on-ball:${th.onBall};--on-ball-dark:${th.onBallDark};--sub-opacity:1;`;
  }
  function applyTheme(){
    try{ const app = document.getElementById('app'); if(app && app.style) app.style.cssText = themeStyle(); }catch(e){}
  }
  function faviconFor(color){
    return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='17' fill='${color}' stroke='#FBF6EC' stroke-width='2'/><path d='M20 3 L20 37 M3 20 L37 20 M7 7 L33 33 M33 7 L7 33' stroke='#FBF6EC' stroke-width='1.4' opacity='0.7'/></svg>`);
  }
  function applyBranding(){
    try{
      document.title = (team.name ? team.name + ' \u2014 ' : '') + 'Weekly Lineup';
      let link = document.querySelector("link[rel='icon']");
      if(!link){ link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
      link.href = team.logo || faviconFor(themeFor().ball);
      const meta = document.querySelector("meta[name='theme-color']");
      if(meta) meta.setAttribute('content', themeFor().field);
    }catch(e){}
    refreshHomeIcon();
  }
  let homeIconKey = '';
  function refreshHomeIcon(){
    // iOS puts a transparent icon on a black square, so build a solid 180x180 one: the team's main
    // color with the logo (or the kickball) on it. Only rebuilt when the logo or colors change.
    try{
      const th = themeFor();
      const key = (team.logo ? team.logo.length : 0) + '|' + th.field + '|' + th.ball;
      if(key === homeIconKey) return;
      homeIconKey = key;
      makeHomeIcon().then(url=>{
        if(!url) return;
        let link = document.querySelector("link[rel='apple-touch-icon']");
        if(!link){ link = document.createElement('link'); link.rel = 'apple-touch-icon'; document.head.appendChild(link); }
        link.href = url;
      }).catch(()=>{});
    }catch(e){}
  }
  async function makeHomeIcon(){
    const th = themeFor(), S = 180;
    const canvas = document.createElement('canvas');
    canvas.width = S; canvas.height = S;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = th.field; ctx.fillRect(0, 0, S, S);
    const img = await loadImageSrc(team.logo);
    if(img){
      ctx.fillStyle = '#FBF6EC';
      roundedRectPath(ctx, 18, 18, S-36, S-36, 30);
      ctx.fill();
      const fit = containFit(img, S-56, S-56);
      ctx.drawImage(img, (S-fit.w)/2, (S-fit.h)/2, fit.w, fit.h);
    } else {
      ctx.fillStyle = th.ball;
      ctx.beginPath(); ctx.arc(S/2, S/2, 62, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#FBF6EC'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(S/2, S/2, 62, 0, Math.PI*2); ctx.stroke();
      ctx.lineWidth = 3; ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.moveTo(S/2, S/2-62); ctx.lineTo(S/2, S/2+62); ctx.moveTo(S/2-62, S/2); ctx.lineTo(S/2+62, S/2);
      ctx.moveTo(S/2-44, S/2-44); ctx.lineTo(S/2+44, S/2+44); ctx.moveTo(S/2+44, S/2-44); ctx.lineTo(S/2-44, S/2+44);
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    return canvas.toDataURL('image/png');
  }
  function brandBlockHtml(){
    const mark = team.logo
      ? `<img class="brand-logo" src="${team.logo}" alt="${esc(team.name || 'Team logo')}">`
      : ballSvg();
    const title = team.name ? esc(team.name) : 'Weekly Lineup';
    const sub = team.name
      ? `Weekly lineup \u00b7 ${esc(currentSeason().name)}`
      : 'Kickball \u00b7 equal playing time, tracked across every week';
    const size = team.name && team.name.length > 22 ? ' style="font-size:22px;"' : '';
    return `<div class="brand">${mark}<div><h1${size}>${title}</h1><div class="sub">${sub}</div></div></div>`;
  }

  function loadImageSrc(src){
    return new Promise((resolve)=>{
      if(!src){ resolve(null); return; }
      const im = new Image();
      im.onload = ()=> resolve(im);
      im.onerror = ()=> resolve(null);
      im.src = src;
    });
  }
  function roundedRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }
  function containFit(img, maxW, maxH){
    const s = Math.min(maxW / img.width, maxH / img.height);
    return {w: Math.max(1, Math.round(img.width * s)), h: Math.max(1, Math.round(img.height * s))};
  }

  function processLogoFile(file){
    // Unlike player photos, a logo keeps its transparency (PNG) \u2014 flattening it to a JPEG would
    // put a black box behind it.
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          const w0 = img.naturalWidth || img.width || 300, h0 = img.naturalHeight || img.height || 300;
          const keepAlpha = file.type !== 'image/jpeg';
          const attempt = (maxSide)=>{
            const scale = file.type === 'image/svg+xml' ? maxSide / Math.max(w0, h0) : Math.min(1, maxSide / Math.max(w0, h0));
            const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            if(!keepAlpha){ ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h); }
            ctx.drawImage(img, 0, 0, w, h);
            return keepAlpha ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.9);
          };
          let out = attempt(480);
          if(out.length > 700000) out = attempt(320);
          if(out.length > 700000) out = attempt(200);
          resolve(out);
        };
        img.onerror = ()=> reject(new Error('Could not read that image file.'));
        img.src = e.target.result;
      };
      reader.onerror = ()=> reject(new Error('Could not read that file.'));
      reader.readAsDataURL(file);
    });
  }

  function extractLogoColors(dataUrl){
    // Samples the logo and returns its two most prominent distinct colors (ignoring transparent,
    // near-white, near-black, and gray pixels first, since those are usually outlines/backgrounds).
    return loadImageSrc(dataUrl).then(img=>{
      if(!img) return null;
      const S = 64;
      const canvas = document.createElement('canvas');
      canvas.width = S; canvas.height = S;
      const ctx = canvas.getContext('2d');
      const fit = containFit(img, S, S);
      ctx.drawImage(img, Math.floor((S-fit.w)/2), Math.floor((S-fit.h)/2), fit.w, fit.h);
      const data = ctx.getImageData(0, 0, S, S).data;
      const tally = (strict)=>{
        const buckets = {};
        for(let i=0; i<data.length; i+=4){
          const r = data[i], g = data[i+1], b = data[i+2], al = data[i+3];
          if(al < 128) continue;
          const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
          const light = (mx + mn) / 510;
          const sat = mx === mn ? 0 : (mx - mn) / (255 - Math.abs(mx + mn - 255));
          if(light > 0.94) continue;
          if(strict && (light < 0.1 || sat < 0.25)) continue;
          const key = ((r>>4)<<8) | ((g>>4)<<4) | (b>>4);
          const bk = buckets[key] || (buckets[key] = {n:0, r:0, g:0, b:0});
          bk.n++; bk.r += r; bk.g += g; bk.b += b;
        }
        return Object.values(buckets).sort((x,y)=> y.n - x.n)
          .map(bk=>[bk.r/bk.n, bk.g/bk.n, bk.b/bk.n]);
      };
      let list = tally(true);
      if(!list.length) list = tally(false);   // gray/black-and-white logo
      if(!list.length) return null;
      const dist = (p,q)=> Math.hypot(p[0]-q[0], p[1]-q[1], p[2]-q[2]);
      const first = list[0];
      const second = list.find(c=> dist(c, first) > 90) || null;
      return {primary: rgbToHex(...first), accent: second ? rgbToHex(...second) : null};
    });
  }

  function render(){
    applyTheme();
    applyBranding();
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="scoreboard">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;">
          ${brandBlockHtml()}
          <div class="season-pick" style="min-width:170px;">
            <label style="font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;opacity:0.85;display:block;margin-bottom:3px;">Season</label>
            <select id="seasonSelect">${seasonsMeta.list.map(s=>`<option value="${s.id}" ${s.id===seasonsMeta.currentId?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
          </div>
        </div>
      </div>
      <div class="tabs">
        ${tabBtn('week','This Week')}
        ${tabBtn('roster','Roster')}
        ${tabBtn('attendance','Attendance')}
        ${tabBtn('skills','Skill Ratings')}
        ${tabBtn('fairness','Fairness Report')}
        ${tabBtn('gamestats','Game Stats')}
        ${tabBtn('cards','Player Cards')}
        ${tabBtn('seasons','Seasons')}
        ${tabBtn('team','Team')}
