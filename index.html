      <div class="content">
        ${isNewestSeason() ? '' : `<div style="background:#FFF6DD;border:1px solid var(--dirt);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:12px;">Viewing <b>${esc(currentSeason().name)}</b> \u2014 a past season. Anything you change here edits that season's records. <button class="small ghost" id="goNewestBtn" style="margin-left:8px;">Go to ${esc(seasonsMeta.list[seasonsMeta.list.length-1].name)}</button></div>`}
        ${activeTab==='week' ? renderWeek() : activeTab==='roster' ? renderRoster() : activeTab==='attendance' ? renderAttendance() : activeTab==='skills' ? renderSkills() : activeTab==='gamestats' ? renderGameStats() : activeTab==='cards' ? renderPlayerCards() : activeTab==='seasons' ? renderSeasons() : activeTab==='team' ? renderTeam() : renderFairness()}
      </div>
    `;
    wireEvents();
  }

  function ballSvg(){
    return `<svg class="ball-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="17" style="fill:var(--ball);" stroke="#FBF6EC" stroke-width="2"/>
      <path d="M20 3 L20 37 M3 20 L37 20 M7 7 L33 33 M33 7 L7 33" stroke="#FBF6EC" stroke-width="1.4" opacity="0.7"/>
    </svg>`;
  }

  function tabBtn(key, label){
    return `<button class="tab ${activeTab===key?'active':''}" data-tab="${key}">${label}</button>`;
  }

  function renderWeek(){
    const active = activePlayersForDate(selectedGameDate);
    const longTermActive = activeRoster();
    const absentCount = longTermActive.length - active.length;
    const existingEntry = weekLog.find(w=>w.gameDate===selectedGameDate);
    let html = `<div class="card"><h2>Set up this week</h2>`;
    if(!currentGrid){
      html += `<div class="settings-row">
          <div><label>Game Date</label>
            <select id="gameDateInput">${scheduleDates.length ? '' : '<option value="">No dates scheduled</option>'}${scheduleDates.map(d=>{
              const played = isGamePlayed(d);
              const saved = weekLog.some(w=>w.gameDate===d);
              return `<option value="${d}" ${d===selectedGameDate?'selected':''}>${fmtDate(d)}${played?' (played)':saved?' (saved)':''}</option>`;
            }).join('')}</select>
          </div>
          <div><label>Innings this game</label><input type="number" id="inningsInput" min="1" max="12" value="${innings}" style="width:70px;"></div>
        </div>
        <div class="note">${active.length} player(s) available${absentCount>0?` \u2014 ${absentCount} marked absent for this date (see Attendance tab)`:''}. Generate benches whoever's played the most so far and rotates positions for variety.</div>
        <button class="primary" id="generateBtn" ${active.length===0?'disabled':''}>Generate Lineup</button>
      `;
    } else {
      html += `<div class="note" style="margin-top:0;">Game: <b>${fmtDate(selectedGameDate)}</b> &middot; ${active.length} player(s) available${existingEntry ? '' : ' \u2014 not saved yet'}</div>`;
      if(lastWarning) html += `<div class="warn">${esc(lastWarning)}</div>`;
      html += `<div class="row"><button class="ghost" id="regenBtn">Regenerate</button><button class="primary" id="saveBtn">Save Lineup</button></div>`;
      html += `<div class="note" style="margin-top:10px;">${isGamePlayed(selectedGameDate)
        ? '<b style="color:var(--field-dark);">Marked played</b> \u2014 this lineup counts toward season stats.'
        : 'Not marked played yet \u2014 tick <b>Played</b> in the Attendance tab Schedule once the game happens to count this lineup toward season stats.'}</div>`;
    }
    html += `</div>`;

    const details = peekGameDetails(selectedGameDate);
    html += `<div class="card"><h2>Game Details</h2>
      <div class="note">Included in the JPEG and text export for this date.</div>
      <div class="note" style="margin-top:0;color:var(--field-dark);font-weight:600;">${(details.time||details.field) ? esc([details.time, details.field].filter(Boolean).join('  \u00b7  ')) : 'No time or field set yet'} <span style="font-weight:400;color:var(--ink-soft);">\u2014 time, field, scores, and Played are set on the Attendance tab Schedule</span></div>
      <div class="settings-row">
        <div><label>Opponent</label><input type="text" id="opponentInput" placeholder="Team name" value="${esc(details.opponent||'')}" style="width:200px;"></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <label class="ghost" style="display:inline-flex;align-items:center;padding:8px 14px;border-radius:4px;border:1px solid var(--field);cursor:pointer;font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;color:var(--field-dark);">
          ${details.mapImage ? 'Replace Park Map' : 'Upload Park Map'}<input type="file" id="mapUploadInput" accept="image/*" style="display:none;">
        </label>
        ${details.mapImage ? '<button class="small ghost" id="removeMapBtn">Remove Map</button>' : ''}
      </div>
      ${details.mapImage ? `<div style="margin-top:10px;"><img src="${details.mapImage}" style="max-width:260px;max-height:160px;border:1px solid var(--line);border-radius:4px;"></div>` : ''}
    </div>`;

    const activeForCard = activePlayersForDate(selectedGameDate);
    const protectedSet = neverBenchByDate[selectedGameDate] || {};

    html += `<div class="card"><h2>Never Bench This Game</h2>
      <div class="note">A per-game choice, not permanent \u2014 checking someone here only applies to this specific date. It doesn't exempt them from ever sitting: it just means they're the last one asked, at whatever point the rotation reaches. Everyone still takes their fair first turn before anyone takes a second, protected or not \u2014 protection only decides who goes first when players are otherwise tied.</div>
      <div class="row">`;
    activeForCard.forEach(p=>{
      const checked = !!protectedSet[p.id];

      </label>`;
    });
    html += `</div></div>`;

    if(currentGrid){
      html += `<div class="card"><h2>Batting Order</h2>

      currentBattingOrder.forEach((id, idx)=>{
        html += `<li>
          <span class="num">${idx+1}.</span>
          <span class="bname">${esc(playerName(id))}</span>
          <button class="small ghost" data-bat-up="${idx}" ${idx===0?'disabled':''}>&uarr;</button>
          <button class="small ghost" data-bat-down="${idx}" ${idx===currentBattingOrder.length-1?'disabled':''}>&darr;</button>
        </li>`;
      });
      html += `</ol></div>`;

      // Options come from the full position list for this lineup, NOT from what's currently
      // assigned in inning 1 \u2014 otherwise a position that gets vacated disappears from every
      // dropdown and can't be picked again.
      const optList = currentPosList.concat(['Bench']);
      const chartInnings = currentGrid.length;
      const vacancies = allVacancies();
      html += `<div class="card"><h2>Fielding Chart</h2>
        <div class="note">Each row is a player, each column an inning. Moving someone onto a position another player holds swaps the two of them. Setting a fielder to Bench leaves their position empty until you put someone there.</div>`;
      if(vacancies.length){
        html += `<div class="warn"><b>Empty position${vacancies.reduce((n,v)=>n+v.positions.length,0)>1?'s':''}:</b> ${vacancies.map(v=>`Inning ${v.inning} \u2014 ${esc(v.positions.join(', '))}`).join(' &nbsp;|&nbsp; ')}. Pick someone for ${vacancies.length>1||vacancies[0].positions.length>1?'each of these':'this'} from the dropdowns below (benched players can be moved in).</div>`;
      }
      html += `<div style="overflow-x:auto;"><table><tr><th style="text-align:left;">Player</th>`;
      for(let i=0;i<chartInnings;i++){
        const hasVacancy = vacantPositionsForInning(i).length > 0;
        html += `<th${hasVacancy?' style="background:var(--ball);color:var(--on-ball);"':''}>Inning ${i+1}</th>`;
      }
      html += `</tr>`;
      active.forEach(p=>{

            }
            html += `<option value="${esc(opt)}" ${opt===current?'selected':''}>${esc(label)}</option>`;
          });
          html += `</select></td>`;
        }
        html += `</tr>`;
      });
      html += `</table></div>`;
      currentGrid.forEach((inning, idx)=>{
        const bench = benchForInning(idx).map(playerName);
        const vac = vacantPositionsForInning(idx);
        html += `<div class="bench-line">Inning ${idx+1} bench: ${bench.length ? esc(bench.join(', ')) : 'none'}${vac.length ? ` <b style="color:var(--ball-text);">\u2014 empty: ${esc(vac.join(', '))}</b>` : ''}</div>`;
      });
      html += `<div class="row" style="margin-top:14px;"><button class="ghost" id="cancelWeekBtn">Discard &amp; Start Over</button></div>`;
      html += `</div>`;

      html += `<div class="card"><h2>Share With the Team</h2>
        <div class="note">Export this lineup to send to the group \u2014 a JPEG image for a text/chat, or plain text to paste into an email.</div>
        <div class="row">${canShareFiles() ? '<button class="primary" id="shareImgBtn">Share\u2026</button>' : ''}<button class="${canShareFiles() ? 'ghost' : 'primary'}" id="exportImgBtn">Download as JPEG</button><button class="ghost" id="copyTextBtn">Copy as Text</button></div>
      </div>`;
    }

    if(lastSaveMsg){
      html += `<div class="confirm">${esc(lastSaveMsg)}</div>`;
    }
    if(weekLog.length){
      html += `<div class="card"><h2>Saved Lineups (${weekLog.length})</h2>`;
      weekLog.slice().sort((a,b)=> (a.gameDate||'').localeCompare(b.gameDate||'')).forEach(w=>{
        html += `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;">
          <span>${esc(w.label)}</span>
          <span class="row" style="gap:10px;">
            <span class="badge${isGamePlayed(w.gameDate)?'':' bench'}">${isGamePlayed(w.gameDate)?'Played':'Not played'}</span>
            <button class="small ghost" data-load-week="${w.gameDate}">Load</button>
          </span>
        </div>`;
      });
      html += `</div>`;
    }
    return html;

  function renderRoster(){

  // ---------- Game Stats helpers ----------
  const MIN_GAMES_FOR_SWING = 2; // need at least this many games in BOTH the present and absent groups

  function scoredGames(){
    // One entry per scheduled game that has both scores entered, in date order. "Who was
    // there" comes from the saved lineup for that date when there is one (it's the record
    // of who actually played); otherwise it falls back to the Attendance marks.
    const out = [];
    scheduleDates.slice().sort().forEach(d=>{
      const det = gameDetails[d];
      if(!det) return;
      const result = gameResult(det);
      if(result === null) return;
      const entry = weekLog.find(w=>w.gameDate===d && w.activeIds);
      let ids, source;
      if(entry){
        ids = entry.activeIds.slice();
        source = 'Lineup';
      } else {
        const absent = attendance[d] || {};
        ids = roster.filter(p=>p.active && !absent[p.id]).map(p=>p.id);
        source = 'Attendance';
      }
      out.push({
        date: d,
        details: det,
        result,
        runDiff: Number(det.ourScore) - Number(det.theirScore),
        present: new Set(ids),
        source
      });
    });
    return out;
  }

  function summarizeGames(list){
    // Ties count as half a win for win%.
    let w=0, l=0, t=0, diff=0;
    list.forEach(g=>{
      if(g.result==='W') w++; else if(g.result==='L') l++; else t++;
      diff += g.runDiff;
    });
    const n = list.length;
    return {n, w, l, t, winPct: n ? (w + 0.5*t)/n : null, avgDiff: n ? diff/n : null};
  }
  function fmtRecord(s){ return s.n ? `${s.w}-${s.l}${s.t ? '-'+s.t : ''}` : '\u2014'; }
  function fmtPct(p){ return p===null ? '\u2014' : Math.round(p*100) + '%'; }
  function fmtSigned(x, digits){
    if(x===null || x===undefined) return '\u2014';
    const v = Number(x.toFixed(digits));
    return (v>0 ? '+' : '') + v;
  }
  function statCell(s){
    if(!s.n) return '<span style="color:var(--ink-soft);">0 games</span>';
    return `<b>${s.n}</b> gm &middot; ${fmtRecord(s)} &middot; ${fmtPct(s.winPct)} &middot; ${fmtSigned(s.avgDiff,1)}`;
  }

  function renderGameStats(){
    const games = scoredGames();
    let html = `<div class="card"><h2>Season Record</h2>`;
    if(games.length===0){
      html += `<div class="empty">No scores entered yet \u2014 add them on the This Week tab's Game Details section once a game's played.</div></div>`;
      return html;
    }
    const all = summarizeGames(games);
    html += `<div class="note" style="font-size:16px;font-weight:600;color:var(--field-dark);">${all.w}-${all.l}${all.t?'-'+all.t:''} <span style="font-size:12px;font-weight:400;color:var(--ink-soft);">(${all.w} win${all.w!==1?'s':''}, ${all.l} loss${all.l!==1?'es':''}${all.t?`, ${all.t} tie${all.t!==1?'s':''}`:''}) &middot; average run differential ${fmtSigned(all.avgDiff,1)} per game</span></div>`;
    const attendanceGames = games.filter(g=>g.source==='Attendance');
    if(attendanceGames.length){
      html += `<div class="note" style="margin-top:8px;">${attendanceGames.length} of these games ${attendanceGames.length!==1?'have':'has'} a score but no saved lineup, so who was there comes from your Attendance marks instead (flagged in the games table below).</div>`;
    }
    html += `</div>`;

    const expected = roster.filter(p=>p.active);

    // ---- Per-player: record with vs. without ----
    const rows = expected.map(p=>{
      const sp = summarizeGames(games.filter(g=>g.present.has(p.id)));
      const sa = summarizeGames(games.filter(g=>!g.present.has(p.id)));
      const enough = sp.n >= MIN_GAMES_FOR_SWING && sa.n >= MIN_GAMES_FOR_SWING;
      return {
        p, sp, sa, enough,
        pctSwing: enough ? sp.winPct - sa.winPct : null,
        diffSwing: enough ? sp.avgDiff - sa.avgDiff : null
      };
    });
    rows.sort((a,b)=>{
      if(a.enough !== b.enough) return a.enough ? -1 : 1;
      if(a.enough) return (b.pctSwing - a.pctSwing) || (b.diffSwing - a.diffSwing);
      return a.p.name.localeCompare(b.p.name);
    });

    const tableRows = rows.filter(r=>r.sa.n > 0 || r.sp.n === 0);   // anyone with something to compare
    const neverMissed = rows.filter(r=>r.sa.n === 0 && r.sp.n > 0);  // there for every scored game so far
    html += `<div class="card"><h2>With vs. Without Each Player</h2>
      <div class="note">${games.length} scored game${games.length!==1?'s':''} so far. Each cell reads: games &middot; record &middot; win% &middot; average run differential (runs scored minus runs allowed). Ties count as half a win. The swing is the difference between the two \u2014 positive means the team does better when that player's there. It's only shown once there are at least ${MIN_GAMES_FOR_SWING} games in both columns; before that it's marked "not enough data" instead of showing a percentage that means nothing yet. Even then, treat it as a pattern to watch, not proof \u2014 opponent strength, weather, and who else was out all move these numbers too.</div>`;
    if(tableRows.length){
      html += `<div style="overflow-x:auto;"><table><tr><th style="text-align:left;">Player</th><th>When present</th><th>When absent</th><th>Swing</th></tr>`;
      tableRows.forEach(r=>{
        let swing;
        if(r.enough){
          const pts = Math.round(r.pctSwing*100);
          const good = pts > 0 || (pts === 0 && r.diffSwing > 0);
          const bad = pts < 0 || (pts === 0 && r.diffSwing < 0);
          const color = good ? 'var(--field-dark)' : bad ? 'var(--ball-text)' : 'var(--ink-soft)';
          swing = `<span style="color:${color};font-weight:600;">${pts>0?'+':''}${pts} pts win% &middot; ${fmtSigned(r.diffSwing,1)} runs/game</span>`;
        } else if(r.sp.n === 0){
          swing = '<span style="color:var(--ink-soft);">hasn\'t played a scored game</span>';
        } else {
          swing = '<span style="color:var(--ink-soft);">not enough data</span>';
        }
        html += `<tr><td class="name-cell">${esc(r.p.name)}</td><td>${statCell(r.sp)}</td><td>${statCell(r.sa)}</td><td>${swing}</td></tr>`;
      });
      html += `</table></div>`;
    } else {
      html += `<div class="empty" style="padding:12px;">Everyone has been there for every scored game so far, so there's nothing to compare yet.</div>`;
    }
    if(neverMissed.length){
      const s = summarizeGames(games);
      html += `<div class="note" style="margin-top:12px;"><b>Never missed a scored game</b> (nothing to compare yet \u2014 the team's record with them is just the season record, ${fmtRecord(s)}): ${esc(neverMissed.map(r=>r.p.name).join(', '))}.</div>`;
    }
    html += `</div>`;

    // ---- Core group: team results by how many of the core were there ----
    const core = expected.filter(p=>coreGroup[p.id]);
    html += `<div class="card"><h2>Core Group</h2>
      <div class="note">Pick the players you'd call your core. Below, every scored game is sorted by how many of them were there, so you can see whether the team really does worse when several are out at once \u2014 which single-player numbers can miss. This is your own call; nothing here reads your private skill ratings.</div>
      <div class="row" style="margin-bottom:12px;">`;
    expected.forEach(p=>{
      html += `<label style="font-size:12px;display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:4px;padding:5px 10px;background:var(--cream);">
        <input type="checkbox" data-core-player="${p.id}" ${coreGroup[p.id]?'checked':''}> ${esc(p.name)}
      </label>`;
    });
    html += `</div>`;
    if(core.length === 0){
      html += `<div class="empty" style="padding:12px;">Check at least one player above to see how the team does with the core there or out.</div>`;
    } else {
      const outCount = g => core.filter(p=>!g.present.has(p.id)).length;
      const half = core.length / 2;
      const buckets = [
        {label: `All ${core.length} there`, list: games.filter(g=>outCount(g)===0)},
        {label: 'Some out (up to half)', list: games.filter(g=>{ const o = outCount(g); return o>=1 && o<=half; })},
        {label: 'Most out (more than half)', list: games.filter(g=>outCount(g)>half)}
      ];
      html += `<table><tr><th style="text-align:left;">Core players</th><th>Games</th><th>Record</th><th>Win%</th><th>Avg run diff</th></tr>`;
      buckets.forEach(b=>{
        const s = summarizeGames(b.list);
        html += `<tr><td class="name-cell">${esc(b.label)}</td><td>${s.n}</td><td>${fmtRecord(s)}</td><td>${fmtPct(s.winPct)}</td><td>${fmtSigned(s.avgDiff,1)}</td></tr>`;
      });
      html += `</table>`;
    }
    html += `</div>`;

    // ---- Game by game ----
    const showCore = core.length > 0;
    html += `<div class="card"><h2>Games</h2><div style="overflow-x:auto;"><table><tr><th>Date</th><th>Opponent</th><th>Score</th><th>Result</th><th>Run diff</th><th>Out</th><th style="text-align:left;">Who was out</th>${showCore?'<th>Core out</th>':''}<th>Source</th></tr>`;
    games.forEach(g=>{
      const badgeColor = g.result==='W' ? 'var(--field)' : g.result==='L' ? 'var(--ball)' : 'var(--ink-soft)';
      const resultLabel = g.result==='W' ? 'Win' : g.result==='L' ? 'Loss' : 'Tie';
      const out = expected.filter(p=>!g.present.has(p.id));
      const coreOut = core.filter(p=>!g.present.has(p.id)).length;
      html += `<tr>
        <td>${fmtDate(g.date)}</td>
        <td class="name-cell">${esc(g.details.opponent || '\u2014')}</td>
        <td>${g.details.ourScore} - ${g.details.theirScore}</td>
        <td><span class="badge" style="background:${badgeColor};${g.result==='L'?'color:var(--on-ball);':''}">${resultLabel}</span></td>
        <td>${fmtSigned(g.runDiff,0)}</td>
        <td>${out.length}</td>

  function renderFairness(){
    const all = roster;
    if(all.length===0){
      return `<div class="card"><div class="empty">Add players on the Roster tab to start tracking fairness.</div></div>`;
    }
    const statsNow = computeStats();
    const rows = all.map(p=>{
      const s = statsNow[p.id] || {games:0, inningsFielded:0, inningsBenched:0, positions:{}};
      return {id:p.id, name:p.name, active:p.active, ...s};
    });
    const playedList = rows.filter(r=>r.games>0).map(r=>r.inningsFielded);
    const avg = playedList.length ? playedList.reduce((a,b)=>a+b,0)/playedList.length : 0;
    const maxFielded = Math.max(1, ...rows.map(r=>r.inningsFielded));

    let html = `<div class="card"><h2>Season Fairness</h2>
      <div class="note">Team average innings fielded so far: <b>${avg.toFixed(1)}</b>. Only games ticked Played in the Attendance tab Schedule count toward these numbers \u2014 saving a lineup ahead of time doesn't affect fairness math until the game actually happens. Bars below average are flagged; the generator already prioritizes those players automatically.</div>
      <table><tr><th>Player</th><th>Games</th><th>Innings Fielded</th><th>Innings Benched</th><th>Relative</th></tr>`;
    rows.sort((a,b)=> a.inningsFielded-b.inningsFielded).forEach(r=>{
      const below = r.games>0 && r.inningsFielded < avg;
      const pct = Math.round((r.inningsFielded/maxFielded)*100);
      html += `<tr>
        <td class="name-cell">${esc(r.name)}${r.active?'':' <span class="badge bench">inactive</span>'}</td>
        <td>${r.games}</td>
        <td>${r.inningsFielded}</td>
        <td>${r.inningsBenched}</td>
        <td style="min-width:120px;"><div class="bar-track ${below?'fair-below':''}"><div class="bar-fill" style="width:${pct}%;"></div></div></td>
      </tr>`;
    });
    html += `</table></div>`;

    html += `<div class="card"><h2>Position Variety</h2><div style="overflow-x:auto;"><table><tr><th>Player</th>`;
    positions.forEach(pos=> html += `<th>${esc(pos)}</th>`);
    html += `</tr>`;
    rows.forEach(r=>{
      html += `<tr><td class="name-cell">${esc(r.name)}</td>`;
      positions.forEach(pos=>{
        html += `<td>${(r.positions && r.positions[pos]) || 0}</td>`;
      });
      html += `</tr>`;
    });
    html += `</table></div></div>`;

    if(Object.keys(baseline).length){
      const career = computeCareerStats();
      const careerRows = roster.filter(p=>career[p.id] && (career[p.id].games>0 || career[p.id].inningsFielded>0))
        .sort((a,b)=> career[b.id].games - career[a.id].games || a.name.localeCompare(b.name));
      html += `<div class="card"><h2>Career Totals</h2>
        <div class="note">This season plus everything carried over from earlier seasons. The Season Fairness numbers above start fresh each season so new players aren't judged "behind"; position history from here carries into the generator so players stay in spots they know.</div>
        <table><tr><th style="text-align:left;">Player</th><th>Games</th><th>Innings Fielded</th><th>Innings Benched</th><th style="text-align:left;">Most-played positions</th></tr>`;
      careerRows.forEach(p=>{
        const s = career[p.id];
        const top = Object.entries(s.positions).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([pos,n])=>`${esc(pos)} ${n}`).join(', ') || '\u2014';
        html += `<tr><td class="name-cell">${esc(p.name)}${p.active?'':' <span class="badge bench">inactive</span>'}</td><td>${s.games}</td><td>${s.inningsFielded}</td><td>${s.inningsBenched}</td><td style="text-align:left;">${top}</td></tr>`;
      });
      html += `</table></div>`;
    }
    return html;
  }

      });
    });
    document.querySelectorAll('[data-genskill-player]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const pid = sel.getAttribute('data-genskill-player');
        const name = sel.getAttribute('data-genskill-name');
        if(!generalSkills[pid]) generalSkills[pid] = {};
        generalSkills[pid][name] = parseInt(sel.value,10);
        saveConfig();
      });
    });
    const addDateBtn = document.getElementById('addDateBtn');
    if(addDateBtn) addDateBtn.addEventListener('click', ()=>{
      const inp = document.getElementById('addDateInput');
      if(inp.value && !scheduleDates.includes(inp.value)){
        scheduleDates.push(inp.value);
        scheduleDates.sort();
        saveConfig();
        render();
      }
    });
    document.querySelectorAll('[data-remove-date]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const d = btn.getAttribute('data-remove-date');
        if(confirm(`Remove ${fmtDate(d)} from the schedule? Attendance marks for that date will be lost.`)){
          scheduleDates = scheduleDates.filter(x=>x!==d);
          delete attendance[d];
          if(selectedGameDate === d) selectedGameDate = nextUnplayedDate();
          saveConfig();
          render();
        }
      });
    });
    document.querySelectorAll('[data-schedule-opponent]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const d = inp.getAttribute('data-schedule-opponent');
        ensureGameDetails(d).opponent = inp.value;
        saveConfig();
      });
    });
    document.querySelectorAll('[data-schedule-time]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        ensureGameDetails(inp.getAttribute('data-schedule-time')).time = inp.value;
        saveConfig();
      });
    });
    document.querySelectorAll('[data-schedule-field]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        ensureGameDetails(inp.getAttribute('data-schedule-field')).field = inp.value;
        saveConfig();
      });
    });
    const scoreVal = inp => inp.value === '' ? null : Number(inp.value);
    document.querySelectorAll('[data-schedule-our]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        ensureGameDetails(inp.getAttribute('data-schedule-our')).ourScore = scoreVal(inp);
        saveConfig();
        render();
      });
    });
    document.querySelectorAll('[data-schedule-their]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        ensureGameDetails(inp.getAttribute('data-schedule-their')).theirScore = scoreVal(inp);
        saveConfig();
        render();
      });
    });
    document.querySelectorAll('[data-schedule-played]').forEach(box=>{
      box.addEventListener('change', ()=> setGamePlayed(box.getAttribute('data-schedule-played'), box.checked));
    });
    document.querySelectorAll('[data-att-player]').forEach(box=>{
      box.addEventListener('change', ()=>{
        const pid = box.getAttribute('data-att-player');
        const d = box.getAttribute('data-att-date');
        if(!attendance[d]) attendance[d] = {};
        if(box.checked) attendance[d][pid] = true;
        else delete attendance[d][pid];
        saveConfig();
      });
    });

    document.querySelectorAll('[data-card-photo]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const pid = inp.getAttribute('data-card-photo');
        if(inp.files && inp.files[0]){
          try{
            const dataUrl = await downscaleImageFile(inp.files[0], 700);
            ensurePlayerCard(pid).photo = dataUrl;
            saveConfig();
            render();
          }catch(err){
            alert('Could not use that image: ' + err.message);
          }
        }
      });
    });
    document.querySelectorAll('[data-card-remove-photo]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        ensurePlayerCard(btn.getAttribute('data-card-remove-photo')).photo = null;
        saveConfig();
        render();
      });
    });
    document.querySelectorAll('[data-card-tagline]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        ensurePlayerCard(inp.getAttribute('data-card-tagline')).tagline = inp.value;
        saveConfig();
      });
    });
    document.querySelectorAll('[data-card-download]').forEach(btn=>{
      btn.addEventListener('click', ()=> downloadPlayerCard(btn.getAttribute('data-card-download')));
    });
  }

  loadState();
})();
</script>
